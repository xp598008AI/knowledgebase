<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="635" viewBox="0 0 2400 635"><title>硬件工程：输入输出与评审点</title><desc>覆盖32过程。每卡包含目的、输入、输出、流向及建议评审点。工程概念示意，Draft。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#59677c" /></marker></defs><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><rect width="2400" height="635" fill="#f5f7fb" /><text x="45" y="51" font-size="38" fill="#197d94" font-weight="700" id="txt0">03  硬件工程</text><text x="45" y="94" font-size="25" fill="#263449" font-weight="600" id="txt1">SYS.2/SYS.3 → HWE.1 → HWE.2 → HWE.3 → HWE.4 → SYS.4</text><text x="45" y="132" font-size="22" fill="#526276" font-weight="400" id="txt2">HWE.2 ⇢ HWE.3（设计符合性）；HWE.1 ⇢ HWE.4（需求符合性）。硬件设计输出还用于制作样件。</text><rect x="45.0" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="165" width="7" height="350" rx="3" fill="#197d94" /><text x="67.0" y="201" font-size="29" fill="#197d94" font-weight="700" id="txt3">HWE.1</text><text x="67.0" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt4">硬件需求分析</text><text x="67.0" y="277" font-size="23" fill="#263449" font-weight="700" id="txt5">目的</text><text x="130.0" y="277" font-size="25" fill="#263449" font-weight="400" id="txt6">明确电气、环境与硬件接口要求</text><text x="67.0" y="315" font-size="23" fill="#526276" font-weight="700" id="txt7">输入</text><text x="130.0" y="315" font-size="25" fill="#526276" font-weight="400" id="txt8">SyRS、系统架构、ICD</text><text x="67.0" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt9">输出</text><text x="130.0" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt10">HRS、分析记录、需求追溯</text><text x="67.0" y="442" font-size="22" fill="#197d94" font-weight="500" id="txt11">→ HWE.2；HWE.4</text><rect x="61.0" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 470L88.0 480L78.0 490L68.0 480Z" fill="#c64132" /><text x="96.0" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt12">R14 约束、可行性与可验证性</text><rect x="631.25" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="631.25" y="165" width="7" height="350" rx="3" fill="#197d94" /><text x="653.25" y="201" font-size="29" fill="#197d94" font-weight="700" id="txt13">HWE.2</text><text x="653.25" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt14">硬件设计</text><text x="653.25" y="277" font-size="23" fill="#263449" font-weight="700" id="txt15">目的</text><text x="716.25" y="277" font-size="25" fill="#263449" font-weight="400" id="txt16">形成可实现的电路和物理设计</text><text x="653.25" y="315" font-size="23" fill="#526276" font-weight="700" id="txt17">输入</text><text x="716.25" y="315" font-size="25" fill="#526276" font-weight="400" id="txt18">HRS、器件资料、制造约束</text><text x="653.25" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt19">输出</text><text x="716.25" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt20">设计说明、原理图、PCB、BOM</text><text x="653.25" y="442" font-size="22" fill="#197d94" font-weight="500" id="txt21">→ HWE.3；SYS.4（硬件要素）</text><rect x="647.25" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M664.25 470L674.25 480L664.25 490L654.25 480Z" fill="#c64132" /><text x="682.25" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt22">R15 电路、布局、计算与风险</text><rect x="1217.5" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1217.5" y="165" width="7" height="350" rx="3" fill="#197d94" /><text x="1239.5" y="201" font-size="29" fill="#197d94" font-weight="700" id="txt23">HWE.3</text><text x="1239.5" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt24">对硬件设计的验证</text><text x="1239.5" y="277" font-size="23" fill="#263449" font-weight="700" id="txt25">目的</text><text x="1302.5" y="277" font-size="25" fill="#263449" font-weight="400" id="txt26">验证实物及设计假设符合设计</text><text x="1239.5" y="315" font-size="23" fill="#526276" font-weight="700" id="txt27">输入</text><text x="1302.5" y="315" font-size="25" fill="#526276" font-weight="400" id="txt28">设计包、样件、验证规格</text><text x="1239.5" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt29">输出</text><text x="1302.5" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt30">设计验证记录、测量与问题单</text><text x="1239.5" y="442" font-size="22" fill="#197d94" font-weight="500" id="txt31">→ HWE.4；SUP.9</text><rect x="1233.5" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1250.5 470L1260.5 480L1250.5 490L1240.5 480Z" fill="#c64132" /><text x="1268.5" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt32">R16 设计符合性及测量证据</text><rect x="1803.75" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1803.75" y="165" width="7" height="350" rx="3" fill="#197d94" /><text x="1825.75" y="201" font-size="29" fill="#197d94" font-weight="700" id="txt33">HWE.4</text><text x="1825.75" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt34">对硬件需求的验证</text><text x="1825.75" y="277" font-size="23" fill="#263449" font-weight="700" id="txt35">目的</text><text x="1888.75" y="277" font-size="25" fill="#263449" font-weight="400" id="txt36">对硬件要求逐项取得符合证据</text><text x="1825.75" y="315" font-size="23" fill="#526276" font-weight="700" id="txt37">输入</text><text x="1888.75" y="315" font-size="25" fill="#526276" font-weight="400" id="txt38">HRS、样件、验证环境</text><text x="1825.75" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt39">输出</text><text x="1888.75" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt40">硬件需求验证报告、覆盖/偏差</text><text x="1825.75" y="442" font-size="22" fill="#197d94" font-weight="500" id="txt41">→ SYS.4；SPL.2；SUP.9</text><rect x="1819.75" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1836.75 470L1846.75 480L1836.75 490L1826.75 480Z" fill="#c64132" /><text x="1854.75" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt42">R17 需求覆盖、工况与结果</text><path d="M599.25 340L626.25 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M1185.5 340L1212.5 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M1771.75 340L1798.75 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><text x="45" y="619" font-size="22" fill="#a92f25" font-weight="500" id="txt43">◇ R01～R32：建议工程评审/决策点；并非标准强制门禁或已完成审批。</text></g></svg>