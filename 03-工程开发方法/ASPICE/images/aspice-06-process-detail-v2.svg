<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1025" viewBox="0 0 2400 1025"><title>管理、供应商与组织积累：输入输出与评审点</title><desc>覆盖32过程。每卡包含目的、输入、输出、流向及建议评审点。工程概念示意，Draft。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#59677c" /></marker></defs><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><rect width="2400" height="1025" fill="#f5f7fb" /><text x="45" y="51" font-size="38" fill="#3d629b" font-weight="700" id="txt0">06  管理、供应商与组织积累</text><text x="45" y="94" font-size="25" fill="#263449" font-weight="600" id="txt1">MAN.3/MAN.5/MAN.6 ⇄ 全部过程；ACQ.4 → 工程交付接受；项目反馈 → PIM.3 → 项目部署</text><text x="45" y="132" font-size="22" fill="#526276" font-weight="400" id="txt2">REU.2 → 工程过程复用；使用反馈 → REU.2维护。各管理活动按需持续执行，不是开发后的尾工。</text><rect x="45.0" y="165" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="165" width="7" height="350" rx="3" fill="#3d629b" /><text x="67.0" y="201" font-size="29" fill="#3d629b" font-weight="700" id="txt3">MAN.3</text><text x="67.0" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt4">项目管理</text><text x="67.0" y="277" font-size="23" fill="#263449" font-weight="700" id="txt5">目的</text><text x="130.0" y="277" font-size="25" fill="#263449" font-weight="400" id="txt6">估算计划、协调并调整项目执行</text><text x="67.0" y="315" font-size="23" fill="#526276" font-weight="700" id="txt7">输入</text><text x="130.0" y="315" font-size="25" fill="#526276" font-weight="400" id="txt8">合同/范围、资源、需求、估算</text><text x="67.0" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt9">输出</text><text x="130.0" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt10">计划/WBS、状态、偏差恢复计划</text><text x="67.0" y="442" font-size="22" fill="#3d629b" font-weight="500" id="txt11">→ 全部适用过程；ACQ.4</text><rect x="61.0" y="460" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 470L88.0 480L78.0 490L68.0 480Z" fill="#c64132" /><text x="96.0" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt12">R27 里程碑、资源、依赖与偏差</text><rect x="826.6666666666666" y="165" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="826.6666666666666" y="165" width="7" height="350" rx="3" fill="#3d629b" /><text x="848.6666666666666" y="201" font-size="29" fill="#3d629b" font-weight="700" id="txt13">MAN.5</text><text x="848.6666666666666" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt14">风险管理</text><text x="848.6666666666666" y="277" font-size="23" fill="#263449" font-weight="700" id="txt15">目的</text><text x="911.6666666666666" y="277" font-size="25" fill="#263449" font-weight="400" id="txt16">预防未来不利事件并监控残余风险</text><text x="848.6666666666666" y="315" font-size="23" fill="#526276" font-weight="700" id="txt17">输入</text><text x="911.6666666666666" y="315" font-size="25" fill="#526276" font-weight="400" id="txt18">技术未知、资源/供应商约束</text><text x="848.6666666666666" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt19">输出</text><text x="911.6666666666666" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt20">风险登记、措施、触发阈值记录</text><text x="848.6666666666666" y="442" font-size="22" fill="#3d629b" font-weight="500" id="txt21">→ MAN.3；受影响过程；SUP.9</text><rect x="842.6666666666666" y="460" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M859.6666666666666 470L869.6666666666666 480L859.6666666666666 490L849.6666666666666 480Z" fill="#c64132" /><text x="877.6666666666666" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt22">R28 风险优先级与措施有效性</text><rect x="1608.3333333333333" y="165" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1608.3333333333333" y="165" width="7" height="350" rx="3" fill="#3d629b" /><text x="1630.3333333333333" y="201" font-size="29" fill="#3d629b" font-weight="700" id="txt23">MAN.6</text><text x="1630.3333333333333" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt24">度量</text><text x="1630.3333333333333" y="277" font-size="23" fill="#263449" font-weight="700" id="txt25">目的</text><text x="1693.3333333333333" y="277" font-size="25" fill="#263449" font-weight="400" id="txt26">用可信指标支持工程与管理决策</text><text x="1630.3333333333333" y="315" font-size="23" fill="#526276" font-weight="700" id="txt27">输入</text><text x="1693.3333333333333" y="315" font-size="25" fill="#526276" font-weight="400" id="txt28">信息需求、目标、过程数据</text><text x="1630.3333333333333" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt29">输出</text><text x="1693.3333333333333" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt30">度量计划、指标定义、分析行动</text><text x="1630.3333333333333" y="442" font-size="22" fill="#3d629b" font-weight="500" id="txt31">→ MAN.3/MAN.5；PIM.3</text><rect x="1624.3333333333333" y="460" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1641.3333333333333 470L1651.3333333333333 480L1641.3333333333333 490L1631.3333333333333 480Z" fill="#c64132" /><text x="1659.3333333333333" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt32">R29 数据口径、可信度与行动</text><rect x="45.0" y="555" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="555" width="7" height="350" rx="3" fill="#3d629b" /><text x="67.0" y="591" font-size="29" fill="#3d629b" font-weight="700" id="txt33">ACQ.4</text><text x="67.0" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt34">供应商监控</text><text x="67.0" y="667" font-size="23" fill="#263449" font-weight="700" id="txt35">目的</text><text x="130.0" y="667" font-size="25" fill="#263449" font-weight="400" id="txt36">按约定跟踪供应商状态及交付</text><text x="67.0" y="705" font-size="23" fill="#526276" font-weight="700" id="txt37">输入</text><text x="130.0" y="705" font-size="25" fill="#526276" font-weight="400" id="txt38">技术约定、计划、交付准则</text><text x="67.0" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt39">输出</text><text x="130.0" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt40">状态、交付检查、评审/升级记录</text><text x="67.0" y="832" font-size="22" fill="#3d629b" font-weight="500" id="txt41">→ 工程过程接受交付；MAN.3</text><rect x="61.0" y="850" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 860L88.0 870L78.0 880L68.0 870Z" fill="#c64132" /><text x="96.0" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt42">R30 技术进度、交付证据与问题</text><rect x="826.6666666666666" y="555" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="826.6666666666666" y="555" width="7" height="350" rx="3" fill="#3d629b" /><text x="848.6666666666666" y="591" font-size="29" fill="#3d629b" font-weight="700" id="txt43">PIM.3</text><text x="848.6666666666666" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt44">过程改进</text><text x="848.6666666666666" y="667" font-size="23" fill="#263449" font-weight="700" id="txt45">目的</text><text x="911.6666666666666" y="667" font-size="25" fill="#263449" font-weight="400" id="txt46">以痛点和证据推动并评价改进</text><text x="848.6666666666666" y="705" font-size="23" fill="#526276" font-weight="700" id="txt47">输入</text><text x="911.6666666666666" y="705" font-size="25" fill="#526276" font-weight="400" id="txt48">评估发现、复盘、度量趋势</text><text x="848.6666666666666" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt49">输出</text><text x="911.6666666666666" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt50">改进计划、试点、效果与过程更新</text><text x="848.6666666666666" y="832" font-size="22" fill="#3d629b" font-weight="500" id="txt51">→ 组织过程→各项目部署</text><rect x="842.6666666666666" y="850" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M859.6666666666666 860L869.6666666666666 870L859.6666666666666 880L849.6666666666666 870Z" fill="#c64132" /><text x="877.6666666666666" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt52">R31 改进目标、试点与效果</text><rect x="1608.3333333333333" y="555" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1608.3333333333333" y="555" width="7" height="350" rx="3" fill="#3d629b" /><text x="1630.3333333333333" y="591" font-size="29" fill="#3d629b" font-weight="700" id="txt53">REU.2</text><text x="1630.3333333333333" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt54">可复用产品管理</text><text x="1630.3333333333333" y="667" font-size="23" fill="#263449" font-weight="700" id="txt55">目的</text><text x="1693.3333333333333" y="667" font-size="25" fill="#263449" font-weight="400" id="txt56">管理复用机会、资产约束与维护</text><text x="1630.3333333333333" y="705" font-size="23" fill="#526276" font-weight="700" id="txt57">输入</text><text x="1693.3333333333333" y="705" font-size="25" fill="#526276" font-weight="400" id="txt58">产品组合、共性需求、复用机会</text><text x="1630.3333333333333" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt59">输出</text><text x="1693.3333333333333" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt60">复用策略、资产目录、维护记录</text><text x="1630.3333333333333" y="832" font-size="22" fill="#3d629b" font-weight="500" id="txt61">→ SYS/SWE/HWE/MLE按需复用</text><rect x="1624.3333333333333" y="850" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1641.3333333333333 860L1651.3333333333333 870L1641.3333333333333 880L1631.3333333333333 870Z" fill="#c64132" /><text x="1659.3333333333333" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt62">R32 适用约束、版本与修改影响</text><text x="45" y="1009" font-size="22" fill="#a92f25" font-weight="500" id="txt63">◇ R01～R32：建议工程评审/决策点；并非标准强制门禁或已完成审批。</text></g></svg>