<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1025" viewBox="0 0 2400 1025"><title>系统与交付主线：输入输出与评审点</title><desc>覆盖32过程。每卡包含目的、输入、输出、流向及建议评审点。工程概念示意，Draft。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#59677c" /></marker></defs><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><rect width="2400" height="1025" fill="#f5f7fb" /><text x="45" y="51" font-size="38" fill="#dd6b20" font-weight="700" id="txt0">01  系统与交付主线</text><text x="45" y="94" font-size="25" fill="#263449" font-weight="600" id="txt1">SYS.1 → SYS.2 → SYS.3 → 软/硬件开发 → SYS.4 → SYS.5 → VAL.1 → SPL.2</text><text x="45" y="132" font-size="22" fill="#526276" font-weight="400" id="txt2">虚线依据：SYS.1 ⇢ VAL.1；SYS.2 ⇢ SYS.5；SYS.3 ⇢ SYS.4。确认与发布可按项目并行安排。</text><rect x="45.0" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="165" width="7" height="350" rx="3" fill="#dd6b20" /><text x="67.0" y="201" font-size="29" fill="#dd6b20" font-weight="700" id="txt3">SYS.1</text><text x="67.0" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt4">需求获取</text><text x="67.0" y="277" font-size="23" fill="#263449" font-weight="700" id="txt5">目的</text><text x="130.0" y="277" font-size="25" fill="#263449" font-weight="400" id="txt6">统一并澄清利益相关方诉求</text><text x="67.0" y="315" font-size="23" fill="#526276" font-weight="700" id="txt7">输入</text><text x="130.0" y="315" font-size="25" fill="#526276" font-weight="400" id="txt8">客户需求、合同、法规清单</text><text x="67.0" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt9">输出</text><text x="130.0" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt10">StRS需求库、澄清与一致记录</text><text x="67.0" y="442" font-size="22" fill="#dd6b20" font-weight="500" id="txt11">→ SYS.2；VAL.1；MAN.3</text><rect x="61.0" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 470L88.0 480L78.0 490L68.0 480Z" fill="#c64132" /><text x="96.0" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt12">R01 需求来源、冲突与一致性</text><rect x="631.25" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="631.25" y="165" width="7" height="350" rx="3" fill="#dd6b20" /><text x="653.25" y="201" font-size="29" fill="#dd6b20" font-weight="700" id="txt13">SYS.2</text><text x="653.25" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt14">系统需求分析</text><text x="653.25" y="277" font-size="23" fill="#263449" font-weight="700" id="txt15">目的</text><text x="716.25" y="277" font-size="25" fill="#263449" font-weight="400" id="txt16">形成可行、可验证的系统要求</text><text x="653.25" y="315" font-size="23" fill="#526276" font-weight="700" id="txt17">输入</text><text x="716.25" y="315" font-size="25" fill="#526276" font-weight="400" id="txt18">StRS、系统边界与约束</text><text x="653.25" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt19">输出</text><text x="716.25" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt20">SyRS、分析记录、需求追溯</text><text x="653.25" y="442" font-size="22" fill="#dd6b20" font-weight="500" id="txt21">→ SYS.3；SWE.1/HWE.1；SYS.5</text><rect x="647.25" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M664.25 470L674.25 480L664.25 490L654.25 480Z" fill="#c64132" /><text x="682.25" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt22">R02 可行性、可验证性、追溯</text><rect x="1217.5" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1217.5" y="165" width="7" height="350" rx="3" fill="#dd6b20" /><text x="1239.5" y="201" font-size="29" fill="#dd6b20" font-weight="700" id="txt23">SYS.3</text><text x="1239.5" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt24">系统架构设计</text><text x="1239.5" y="277" font-size="23" fill="#263449" font-weight="700" id="txt25">目的</text><text x="1302.5" y="277" font-size="25" fill="#263449" font-weight="400" id="txt26">分配要求并定义要素及动态交互</text><text x="1239.5" y="315" font-size="23" fill="#526276" font-weight="700" id="txt27">输入</text><text x="1302.5" y="315" font-size="25" fill="#526276" font-weight="400" id="txt28">SyRS、平台约束、风险分析</text><text x="1239.5" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt29">输出</text><text x="1302.5" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt30">系统架构、ICD、分配及分析</text><text x="1239.5" y="442" font-size="22" fill="#dd6b20" font-weight="500" id="txt31">→ SWE.1/HWE.1；SYS.4</text><rect x="1233.5" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1250.5 470L1260.5 480L1250.5 490L1240.5 480Z" fill="#c64132" /><text x="1268.5" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt32">R03 分配、接口、时序与风险</text><rect x="1803.75" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1803.75" y="165" width="7" height="350" rx="3" fill="#dd6b20" /><text x="1825.75" y="201" font-size="29" fill="#dd6b20" font-weight="700" id="txt33">SYS.4</text><text x="1825.75" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt34">系统集成与集成验证</text><text x="1825.75" y="277" font-size="23" fill="#263449" font-weight="700" id="txt35">目的</text><text x="1888.75" y="277" font-size="25" fill="#263449" font-weight="400" id="txt36">依据架构验证接口与要素协同</text><text x="1825.75" y="315" font-size="23" fill="#526276" font-weight="700" id="txt37">输入</text><text x="1888.75" y="315" font-size="25" fill="#526276" font-weight="400" id="txt38">架构/ICD、要素版本、集成策略</text><text x="1825.75" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt39">输出</text><text x="1888.75" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt40">集成系统、规格、报告与日志</text><text x="1825.75" y="442" font-size="22" fill="#dd6b20" font-weight="500" id="txt41">→ SYS.5；SUP.9</text><rect x="1819.75" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1836.75 470L1846.75 480L1836.75 490L1826.75 480Z" fill="#c64132" /><text x="1854.75" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt42">R04 集成准入、接口与结果</text><rect x="45.0" y="555" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="555" width="7" height="350" rx="3" fill="#dd6b20" /><text x="67.0" y="591" font-size="29" fill="#dd6b20" font-weight="700" id="txt43">SYS.5</text><text x="67.0" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt44">系统验证</text><text x="67.0" y="667" font-size="23" fill="#263449" font-weight="700" id="txt45">目的</text><text x="130.0" y="667" font-size="25" fill="#263449" font-weight="400" id="txt46">依据系统需求取得符合性证据</text><text x="67.0" y="705" font-size="23" fill="#526276" font-weight="700" id="txt47">输入</text><text x="130.0" y="705" font-size="25" fill="#526276" font-weight="400" id="txt48">SyRS、集成系统、验证策略</text><text x="67.0" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt49">输出</text><text x="130.0" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt50">系统验证规格、报告、覆盖表</text><text x="67.0" y="832" font-size="22" fill="#dd6b20" font-weight="500" id="txt51">→ VAL.1；SPL.2；SUP.9</text><rect x="61.0" y="850" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 860L88.0 870L78.0 880L68.0 870Z" fill="#c64132" /><text x="96.0" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt52">R05 需求覆盖、结果与偏差</text><rect x="631.25" y="555" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="631.25" y="555" width="7" height="350" rx="3" fill="#dd6b20" /><text x="653.25" y="591" font-size="29" fill="#dd6b20" font-weight="700" id="txt53">VAL.1</text><text x="653.25" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt54">确认</text><text x="653.25" y="667" font-size="23" fill="#263449" font-weight="700" id="txt55">目的</text><text x="716.25" y="667" font-size="25" fill="#263449" font-weight="400" id="txt56">验证预期使用是否满足使用期待</text><text x="653.25" y="705" font-size="23" fill="#526276" font-weight="700" id="txt57">输入</text><text x="716.25" y="705" font-size="25" fill="#526276" font-weight="400" id="txt58">StRS、使用场景、产品版本</text><text x="653.25" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt59">输出</text><text x="716.25" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt60">确认规格、场景记录、确认报告</text><text x="653.25" y="832" font-size="22" fill="#dd6b20" font-weight="500" id="txt61">→ SPL.2；SYS.1反馈；SUP.9</text><rect x="647.25" y="850" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M664.25 860L674.25 870L664.25 880L654.25 870Z" fill="#c64132" /><text x="682.25" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt62">R06 场景代表性、结果与限制</text><rect x="1217.5" y="555" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1217.5" y="555" width="7" height="350" rx="3" fill="#dd6b20" /><text x="1239.5" y="591" font-size="29" fill="#dd6b20" font-weight="700" id="txt63">SPL.2</text><text x="1239.5" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt64">产品发布</text><text x="1239.5" y="667" font-size="23" fill="#263449" font-weight="700" id="txt65">目的</text><text x="1302.5" y="667" font-size="25" fill="#263449" font-weight="400" id="txt66">按准则批准并受控交付产品</text><text x="1239.5" y="705" font-size="23" fill="#526276" font-weight="700" id="txt67">输入</text><text x="1302.5" y="705" font-size="25" fill="#526276" font-weight="400" id="txt68">基线、验证/确认结果、问题状态</text><text x="1239.5" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt69">输出</text><text x="1302.5" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt70">发布审批、说明、交付包与清单</text><text x="1239.5" y="832" font-size="22" fill="#dd6b20" font-weight="500" id="txt71">→ 客户接收；MAN.3；PIM.3</text><rect x="1233.5" y="850" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1250.5 860L1260.5 870L1250.5 880L1240.5 870Z" fill="#c64132" /><text x="1268.5" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt72">R07 发布范围、基线与已知问题</text><path d="M599.25 340L626.25 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M1185.5 340L1212.5 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M1771.75 340L1798.75 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M2079.375 518L2079.375 535L320.625 535L320.625 550" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M599.25 730L626.25 730" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M1185.5 730L1212.5 730" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><text x="45" y="1009" font-size="22" fill="#a92f25" font-weight="500" id="txt73">◇ R01～R32：建议工程评审/决策点；并非标准强制门禁或已完成审批。</text></g></svg>