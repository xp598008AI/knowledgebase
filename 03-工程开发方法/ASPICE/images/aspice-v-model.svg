<!-- boxes --><g filter="url(#s)"><rect x="75" y="180" width="245" height="82" rx="13" fill="#eff6ff" stroke="#93c5fd"/><rect x="260" y="295" width="220" height="82" rx="13" fill="#eff6ff" stroke="#93c5fd"/><rect x="420" y="405" width="220" height="82" rx="13" fill="#eff6ff" stroke="#93c5fd"/><rect x="580" y="530" width="240" height="82" rx="13" fill="#f5f3ff" stroke="#c4b5fd"/><rect x="760" y="405" width="220" height="82" rx="13" fill="#f0fdf4" stroke="#86efac"/><rect x="920" y="295" width="220" height="82" rx="13" fill="#f0fdf4" stroke="#86efac"/><rect x="1080" y="180" width="245" height="82" rx="13" fill="#f0fdf4" stroke="#86efac"/></g>
<g text-anchor="middle"><text x="197" y="207" class="id">SYS.1 / SYS.2</text><text x="197" y="232" class="h">需求获取 → 系统需求</text><text x="197" y="251" class="w">关键输出：可验证系统需求</text><text x="370" y="322" class="id">SYS.3</text><text x="370" y="347" class="h">系统架构设计</text><text x="370" y="366" class="w">分配系统元素与接口</text><text x="530" y="432" class="id">SWE.1 / SWE.2</text><text x="530" y="457" class="h">软件需求 → 软件架构</text><text x="530" y="476" class="w">行为、接口、约束</text><text x="700" y="557" class="id">SWE.3</text><text x="700" y="582" class="h">详细设计与实现</text><text x="700" y="601" class="w">代码 / 配置 / 构建</text><text x="870" y="432" class="id">SWE.4</text><text x="870" y="457" class="h">软件单元验证</text><text x="870" y="476" class="w">边界、异常、覆盖</text><text x="1030" y="322" class="id">SWE.5 / SWE.6</text><text x="1030" y="347" class="h">软件集成与验证</text><text x="1030" y="366" class="w">接口、时序、需求验证</text><text x="1202" y="207" class="id">SYS.4 / SYS.5</text><text x="1202" y="232" class="h">系统集成 → 系统验证</text><text x="1202" y="251" class="w">系统需求与交付证据</text></g>
<!-- correspondence --><g fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"><path d="M320 205C560 125 840 125 1080 205"/><path d="M480 320C650 255 750 255 920 320"/><path d="M640 430C690 405 710 405 760 430"/></g><g text-anchor="middle"><text x="700" y="145" class="w">系统需求 ↔ 系统验证</text><text x="700" y="270" class="w">架构/软件需求 ↔ 集成与软件验证</text><text x="700" y="400" class="w">详细设计 ↔ 单元验证</text></g>
<!-- gates --><g><rect x="85" y="645" width="1230" height="38" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="700" y="670" text-anchor="middle" class="cap">🟠 关键门禁：需求/架构评审通过 ｜ 测试准入条件满足 ｜ 失败项闭环 ｜ 发布基线一致</text></g>
<!-- traceability --> <rect x="45" y="720" width="1310" height="58" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="700" y="744" text-anchor="middle" class="h">🔵 核心证据链：需求 ↔ 架构 ↔ 详细设计/代码 ↔ 测试用例 ↔ 测试结果 ↔ 缺陷/变更 ↔ 基线</text><text x="700" y="765" text-anchor="middle" class="w">每次变更都应完成影响分析，并更新受影响的设计、实现、验证与配置状态</text>
<!-- support --> <rect x="45" y="795" width="640" height="70" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="68" y="823" class="h">MAN 管理过程</text><text x="68" y="847" class="n">计划 · 监控 · 风险 · 资源 · 决策 · 里程碑</text><rect x="715" y="795" width="640" height="70" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="738" y="823" class="h">SUP 支持过程</text><text x="738" y="847" class="n">质量保证 · 配置管理 · 问题解决 · 变更控制 · 评审</text><text x="55" y="890" class="st">说明：工程理解示意图，不是 PAM 官方流程图。过程名称、编号、适用范围及工作产品应按项目采用的 Automotive SPICE 版本与裁剪结果核对。</text></svg>