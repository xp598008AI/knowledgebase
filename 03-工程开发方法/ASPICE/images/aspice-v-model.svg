<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Automotive SPICE 端到端开发与验证全局总览</title>
<desc id="desc">按正确层级展示 SYS.1 需求获取入口，以及 SYS.2-SYS.5、SYS.3-SYS.4、SWE.1-SWE.6、SWE.2-SWE.5、SWE.3-SWE.4 的开发验证对应关系，并展示管理、支持、追溯和门禁。</desc>
<defs>
  <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}
    .title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#64748b}.section{font-size:20px;font-weight:700}
    .id{font-size:16px;font-weight:700}.name{font-size:17px;font-weight:700}.small{font-size:13px;fill:#475569}
    .pair{font-size:14px;font-weight:700;fill:#475569}.bar{font-size:15px;font-weight:700}.note{font-size:13px;fill:#64748b}
  </style>
</defs>

<rect width="1600" height="1100" rx="26" fill="#f8fafc"/>
<text x="60" y="58" class="title">Automotive SPICE：端到端开发与验证全局总览</text>
<text x="60" y="90" class="sub">核心逻辑：需求获取 → 分层分析与设计 → 实现 → 分层验证；每一层按同层目标建立验证对应关系</text>

<!-- legend -->
<g transform="translate(1060 38)">
  <rect width="470" height="64" rx="14" fill="#fff" stroke="#dbe4ef"/>
  <circle cx="24" cy="22" r="7" fill="#2563eb"/><text x="40" y="27" class="small">需求 / 设计</text>
  <circle cx="150" cy="22" r="7" fill="#7c3aed"/><text x="166" y="27" class="small">实现</text>
  <circle cx="258" cy="22" r="7" fill="#16a34a"/><text x="274" y="27" class="small">验证</text>
  <circle cx="358" cy="22" r="7" fill="#f59e0b"/><text x="374" y="27" class="small">门禁</text>
  <circle cx="24" cy="46" r="7" fill="#dc2626"/><text x="40" y="51" class="small">缺陷 / 变更</text>
  <circle cx="150" cy="46" r="7" fill="#64748b"/><text x="166" y="51" class="small">MAN / SUP</text>
</g>

<!-- main canvas -->
<rect x="45" y="125" width="1510" height="755" rx="22" fill="#fff" stroke="#dbe4ef"/>

<!-- entry -->
<g filter="url(#shadow)">
  <rect x="610" y="150" width="380" height="78" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
</g>
<text x="800" y="176" text-anchor="middle" class="id">SYS.1</text>
<text x="800" y="201" text-anchor="middle" class="name">需求获取 / Requirements Elicitation</text>
<text x="800" y="219" text-anchor="middle" class="small">客户 / 利益相关方需求、约束、边界、验收期望</text>
<path d="M800 228 L800 252" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

<!-- headers -->
<text x="110" y="270" class="section" fill="#2563eb">开发侧：逐层分解与设计</text>
<text x="1160" y="270" class="section" fill="#16a34a">验证侧：逐层集成与验证</text>
<text x="800" y="270" text-anchor="middle" class="section" fill="#64748b">正确的一一对应关系</text>

<!-- V rails -->
<path d="M255 330 L355 445 L455 560 L555 675 L660 790" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<path d="M940 790 L1045 675 L1145 560 L1245 445 L1345 330" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
<path d="M660 790 L940 790" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

