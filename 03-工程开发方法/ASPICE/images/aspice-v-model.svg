<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Automotive SPICE V-model and process groups</title>
  <desc id="desc">ASPICE V-model showing requirements, architecture, detailed design, implementation, unit verification, integration verification, system verification and qualification, surrounded by management and support processes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1efff"/><stop offset="1" stop-color="#c9ddfa"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#def7ed"/><stop offset="1" stop-color="#bdebd9"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#27405f" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#536b89"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#17324f}
      .h1{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#526a84}
      .boxTitle{font-size:17px;font-weight:700}.small{font-size:13px;fill:#405a75}
      .pill{font-size:14px;font-weight:700}.note{font-size:14px}
    </style>
  </defs>
  <rect width="1200" height="780" rx="24" fill="url(#bg)"/>
  <text x="48" y="54" class="h1">Automotive SPICE（ASPICE）开发 V 模型</text>
  <text x="48" y="82" class="sub">左侧：需求分解与设计　·　底部：实现　·　右侧：逐层集成、验证与确认</text>
  <rect x="38" y="110" width="1124" height="500" rx="18" fill="#ffffff" stroke="#d8e3f0"/>
  <text x="65" y="145" class="pill" fill="#2862a6">设计与分解（Design / Decomposition）</text>
  <text x="770" y="145" class="pill" fill="#18775c">集成与验证（Integration / Verification）</text>
  <path d="M170 205 L355 320 L515 420 L600 500 L745 420 L855 320 L1020 205" fill="none" stroke="#9aadc3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 205 L355 320 L515 420 L600 500" fill="none" stroke="#477fca" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 500 L745 420 L855 320 L1020 205" fill="none" stroke="#2d9b78" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="80" y="170" width="220" height="70" rx="12" fill="url(#blue)" stroke="#8db5e9"/>
    <rect x="260" y="282" width="190" height="70" rx="12" fill="url(#blue)" stroke="#8db5e9"/>
    <rect x="420" y="382" width="190" height="70" rx="12" fill="url(#blue)" stroke="#8db5e9"/>
    <rect x="500" y="480" width="200" height="70" rx="12" fill="#fff0cf" stroke="#e6bd68"/>
    <rect x="650" y="382" width="190" height="70" rx="12" fill="url(#green)" stroke="#80cbb0"/>
    <rect x="760" y="282" width="190" height="70" rx="12" fill="url(#green)" stroke="#80cbb0"/>
    <rect x="910" y="170" width="220" height="70" rx="12" fill="url(#green)" stroke="#80cbb0"/>
  </g>
  <g text-anchor="middle">
    <text x="190" y="198" class="boxTitle">SYS.1 / SYS.2</text><text x="190" y="222" class="small">需求获取与系统需求分析</text>
    <text x="355" y="310" class="boxTitle">SYS.3</text><text x="355" y="334" class="small">系统架构设计</text>
    <text x="515" y="410" class="boxTitle">SWE.2 / HWE.2</text><text x="515" y="434" class="small">软件 / 硬件架构设计</text>
    <text x="600" y="508" class="boxTitle">SWE.3 / HWE.3</text><text x="600" y="532" class="small">详细设计与实现</text>
    <text x="745" y="410" class="boxTitle">SWE.4 / HWE.4</text><text x="745" y="434" class="small">单元验证与测试</text>
    <text x="855" y="310" class="boxTitle">SWE.5 / HWE.5</text><text x="855" y="334" class="small">集成与集成验证</text>
    <text x="1010" y="198" class="boxTitle">SWE.6 / SYS.4 / SYS.5</text><text x="1010" y="222" class="small">系统验证与系统确认</text>
  </g>
  <g fill="none" stroke="#536b89" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M190 244 L290 277"/><path d="M355 356 L470 377"/><path d="M515 456 L565 476"/>
    <path d="M640 476 L715 456"/><path d="M765 377 L810 356"/><path d="M950 277 L980 244"/>
  </g>
  <rect x="65" y="570" width="1070" height="24" rx="12" fill="#e9eff7"/>
  <text x="600" y="587" text-anchor="middle" class="small">双向追溯：每项需求均应关联设计、实现、验证结果及问题/变更记录</text>
  <rect x="38" y="630" width="540" height="105" rx="16" fill="#f2eaff" stroke="#d0b9f0"/>
  <text x="62" y="660" class="boxTitle">管理过程（MAN）</text>
  <text x="62" y="685" class="note">项目管理、风险管理、度量、决策管理、配置管理</text>
  <text x="62" y="710" class="small">保证计划、资源、基线、风险与进度可控</text>
  <rect x="600" y="630" width="562" height="105" rx="16" fill="#e8f5ff" stroke="#b4d8f4"/>
  <text x="624" y="660" class="boxTitle">支持过程（SUP）</text>
  <text x="624" y="685" class="note">质量保证、验证、评审、问题解决、变更请求</text>
  <text x="624" y="710" class="small">提供独立检查、客观证据和问题闭环</text>
  <text x="48" y="760" class="small">说明：这是过程关系示意图，不是 PAM 官方流程图；具体过程属性与成果应按适用版本及项目裁剪确认。</text>
</svg>
