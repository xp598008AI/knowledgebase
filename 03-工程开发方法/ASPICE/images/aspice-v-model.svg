<title id="title">ASPICE 端到端开发 V 模型</title><desc id="desc">突出需求分解、设计实现、分层验证、双向追溯和横向管理支持过程的工程开发流程图。</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}.t{font-size:32px;font-weight:700}.st{font-size:15px;fill:#64748b}.h{font-size:18px;font-weight:700}.n{font-size:14px;fill:#475569}.id{font-size:15px;font-weight:700}.cap{font-size:14px;font-weight:700}.w{font-size:13px;fill:#475569}</style></defs>
<rect width="1400" height="900" rx="24" fill="#f8fafc"/><text x="55" y="58" class="t">Automotive SPICE：端到端开发与验证主链</text><text x="55" y="88" class="st">先看主链：需求逐层分解 → 架构与实现 → 逐层集成验证；全过程保持双向追溯与问题闭环</text>
<!-- legend --> <g transform="translate(930 40)"><rect width="400" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/><circle cx="25" cy="20" r="7" fill="#2563eb"/><text x="40" y="25" class="w">需求/设计</text><circle cx="145" cy="20" r="7" fill="#7c3aed"/><text x="160" y="25" class="w">实现</text><circle cx="245" cy="20" r="7" fill="#16a34a"/><text x="260" y="25" class="w">验证</text><circle cx="25" cy="42" r="7" fill="#f59e0b"/><text x="40" y="47" class="w">评审门禁</text><circle cx="145" cy="42" r="7" fill="#dc2626"/><text x="160" y="47" class="w">缺陷/变更</text></g>
<rect x="45" y="120" width="1310" height="580" rx="20" fill="#fff" stroke="#dbe4ef"/><text x="75" y="155" class="cap" fill="#2563eb">① 分解与设计</text><text x="1110" y="155" class="cap" fill="#16a34a">③ 集成与验证</text>
