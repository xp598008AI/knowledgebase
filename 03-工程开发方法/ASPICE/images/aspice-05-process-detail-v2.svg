<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="635" viewBox="0 0 2400 635"><title>贯穿支持与反馈：输入输出与评审点</title><desc>覆盖32过程。每卡包含目的、输入、输出、流向及建议评审点。工程概念示意，Draft。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#59677c" /></marker></defs><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><rect width="2400" height="635" fill="#f5f7fb" /><text x="45" y="51" font-size="38" fill="#be4b42" font-weight="700" id="txt0">05  贯穿支持与反馈</text><text x="45" y="94" font-size="25" fill="#263449" font-weight="600" id="txt1">全部过程 → SUP.9 → 必要时SUP.10 → 受影响过程 → 回归/关闭 → SUP.8基线</text><text x="45" y="132" font-size="22" fill="#526276" font-weight="400" id="txt2">SUP.1 ⇄ 全部过程（检查/整改）；SUP.8 ⇄ 全部过程（配置控制）。这些过程并行贯穿，不按卡片顺序串行。</text><rect x="45.0" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="165" width="7" height="350" rx="3" fill="#be4b42" /><text x="67.0" y="201" font-size="29" fill="#be4b42" font-weight="700" id="txt3">SUP.1</text><text x="67.0" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt4">质量保证</text><text x="67.0" y="277" font-size="23" fill="#263449" font-weight="700" id="txt5">目的</text><text x="130.0" y="277" font-size="25" fill="#263449" font-weight="400" id="txt6">客观检查过程及工作产品符合性</text><text x="67.0" y="315" font-size="23" fill="#526276" font-weight="700" id="txt7">输入</text><text x="130.0" y="315" font-size="25" fill="#526276" font-weight="400" id="txt8">质量规则、计划、工作产品</text><text x="67.0" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt9">输出</text><text x="130.0" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt10">QA计划、检查、偏差与关闭记录</text><text x="67.0" y="442" font-size="22" fill="#be4b42" font-weight="500" id="txt11">→ 责任过程整改；MAN.3升级</text><rect x="61.0" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 470L88.0 480L78.0 490L68.0 480Z" fill="#c64132" /><text x="96.0" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt12">R23 符合性、偏差与关闭证据</text><rect x="631.25" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="631.25" y="165" width="7" height="350" rx="3" fill="#be4b42" /><text x="653.25" y="201" font-size="29" fill="#be4b42" font-weight="700" id="txt13">SUP.8</text><text x="653.25" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt14">配置管理</text><text x="653.25" y="277" font-size="23" fill="#263449" font-weight="700" id="txt15">目的</text><text x="716.25" y="277" font-size="25" fill="#263449" font-weight="400" id="txt16">识别、控制配置项并维护可信基线</text><text x="653.25" y="315" font-size="23" fill="#526276" font-weight="700" id="txt17">输入</text><text x="716.25" y="315" font-size="25" fill="#526276" font-weight="400" id="txt18">需求/设计/代码/环境等配置项</text><text x="653.25" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt19">输出</text><text x="716.25" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt20">CM计划、配置清单、基线与审计</text><text x="653.25" y="442" font-size="22" fill="#be4b42" font-weight="500" id="txt21">→ 全部过程；SPL.2</text><rect x="647.25" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M664.25 470L674.25 480L664.25 490L654.25 480Z" fill="#c64132" /><text x="682.25" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt22">R24 基线完整性、身份与恢复</text><rect x="1217.5" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1217.5" y="165" width="7" height="350" rx="3" fill="#be4b42" /><text x="1239.5" y="201" font-size="29" fill="#be4b42" font-weight="700" id="txt23">SUP.9</text><text x="1239.5" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt24">问题解决管理</text><text x="1239.5" y="277" font-size="23" fill="#263449" font-weight="700" id="txt25">目的</text><text x="1302.5" y="277" font-size="25" fill="#263449" font-weight="400" id="txt26">分析、纠正并验证关闭问题</text><text x="1239.5" y="315" font-size="23" fill="#526276" font-weight="700" id="txt27">输入</text><text x="1302.5" y="315" font-size="25" fill="#526276" font-weight="400" id="txt28">评审/测试/现场问题及原始日志</text><text x="1239.5" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt29">输出</text><text x="1302.5" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt30">问题单、根因、修复/回归证据</text><text x="1239.5" y="442" font-size="22" fill="#be4b42" font-weight="500" id="txt31">→ 受影响过程；必要时SUP.10</text><rect x="1233.5" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1250.5 470L1260.5 480L1250.5 490L1240.5 480Z" fill="#c64132" /><text x="1268.5" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt32">R25 根因、影响、回归与关闭</text><rect x="1803.75" y="165" width="551.25" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1803.75" y="165" width="7" height="350" rx="3" fill="#be4b42" /><text x="1825.75" y="201" font-size="29" fill="#be4b42" font-weight="700" id="txt33">SUP.10</text><text x="1825.75" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt34">变更请求管理</text><text x="1825.75" y="277" font-size="23" fill="#263449" font-weight="700" id="txt35">目的</text><text x="1888.75" y="277" font-size="25" fill="#263449" font-weight="400" id="txt36">分析影响、决策并落实受控变更</text><text x="1825.75" y="315" font-size="23" fill="#526276" font-weight="700" id="txt37">输入</text><text x="1888.75" y="315" font-size="25" fill="#526276" font-weight="400" id="txt38">CR、问题分析、范围/接口变化</text><text x="1825.75" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt39">输出</text><text x="1888.75" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt40">影响分析、批准、落实与关闭</text><text x="1825.75" y="442" font-size="22" fill="#be4b42" font-weight="500" id="txt41">→ 受影响过程；SUP.8；MAN.3</text><rect x="1819.75" y="460" width="519.25" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1836.75 470L1846.75 480L1836.75 490L1826.75 480Z" fill="#c64132" /><text x="1854.75" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt42">R26 CCB决策、回归范围与通知</text><text x="45" y="619" font-size="22" fill="#a92f25" font-weight="500" id="txt43">◇ R01～R32：建议工程评审/决策点；并非标准强制门禁或已完成审批。</text></g></svg>