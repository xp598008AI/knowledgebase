<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1190" viewBox="0 0 1280 1190"><title>ASPICE工程总览与验证对应关系</title><desc>原创工程概念示意，Draft；蓝色证据，橙色开发，绿色基线与发布，红色反馈。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526279"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#213047} .hd{font-size:28px;font-weight:700}.small{font-size:17px}.b{font-size:21px;font-weight:600}.s{font-size:18px} .ar{fill:none;stroke:#526279;stroke-width:2;marker-end:url(#a)}</style><rect width="100%" height="100%" fill="#f6f8fb"/><text x="35" y="48" class="hd">ASPICE工程总览：开发分解、验证对应、受控交付</text><text x="35" y="82" class="small">Automotive SPICE 4.1框架参考｜原创项目实施示意｜v1 · 2026-10-13 · Draft</text><rect x="35" y="110" width="1210" height="80" rx="12" fill="#e8eef8" stroke="#b4c2d3"/><text x="53" y="140" class="b">贯穿：MAN.3项目 · MAN.5风险 · MAN.6度量 · ACQ.4供应商</text><text x="53" y="166" class="s">保障：SUP.1质量 · SUP.8配置 · SUP.9问题 · SUP.10变更；组织：PIM.3改进 · REU.2复用</text><rect x="35" y="220" width="465" height="80" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="250" class="b">SYS.1 需求获取</text><text x="53" y="276" class="s">利益相关方需求</text><rect x="780" y="220" width="465" height="80" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="798" y="250" class="b">VAL.1 确认</text><text x="798" y="276" class="s">预期使用场景与期待</text><path class="ar" stroke-dasharray="7 5" d="M510 260L770 260"/><rect x="35" y="330" width="465" height="80" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="360" class="b">SYS.2 系统需求分析</text><text x="53" y="386" class="s">可验证的系统需求SyRS</text><rect x="780" y="330" width="465" height="80" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="798" y="360" class="b">SYS.5 系统验证</text><text x="798" y="386" class="s">依据系统需求</text><path class="ar" stroke-dasharray="7 5" d="M510 370L770 370"/><path class="ar"  d="M267 300L267 326"/><path class="ar"  d="M1012 330L1012 303"/><rect x="35" y="440" width="465" height="80" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="470" class="b">SYS.3 系统架构</text><text x="53" y="496" class="s">要素分配、接口、动态行为</text><rect x="780" y="440" width="465" height="80" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="798" y="470" class="b">SYS.4 系统集成验证</text><text x="798" y="496" class="s">依据系统架构与接口</text><path class="ar" stroke-dasharray="7 5" d="M510 480L770 480"/><path class="ar"  d="M267 410L267 436"/><path class="ar"  d="M1012 440L1012 413"/><rect x="35" y="550" width="465" height="80" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="580" class="b">SWE.1 软件需求</text><text x="53" y="606" class="s">SRS、派生要求与追溯</text><rect x="780" y="550" width="465" height="80" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="798" y="580" class="b">SWE.6 软件验证</text><text x="798" y="606" class="s">依据软件需求</text><path class="ar" stroke-dasharray="7 5" d="M510 590L770 590"/><path class="ar"  d="M267 520L267 546"/><path class="ar"  d="M1012 550L1012 523"/><rect x="35" y="660" width="465" height="80" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="690" class="b">SWE.2 软件架构</text><text x="53" y="716" class="s">组件、接口、任务与资源</text><rect x="780" y="660" width="465" height="80" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="798" y="690" class="b">SWE.5 组件/集成验证</text><text x="798" y="716" class="s">依据软件架构与组件设计</text><path class="ar" stroke-dasharray="7 5" d="M510 700L770 700"/><path class="ar"  d="M267 630L267 656"/><path class="ar"  d="M1012 660L1012 633"/><rect x="35" y="770" width="465" height="80" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="800" class="b">SWE.3 详细设计与构建</text><text x="53" y="826" class="s">单元设计、代码/模型</text><rect x="780" y="770" width="465" height="80" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="798" y="800" class="b">SWE.4 单元验证</text><text x="798" y="826" class="s">依据详细设计</text><path class="ar" stroke-dasharray="7 5" d="M510 810L770 810"/><path class="ar"  d="M267 740L267 766"/><path class="ar"  d="M1012 770L1012 743"/><path class="ar"  d="M500 810L775 810"/><text x="545" y="798" class="small">单元实现交接</text><rect x="35" y="885" width="590" height="105" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="915" class="b">硬件分支：SYS.3 → HWE.1 → HWE.2</text><text x="53" y="941" class="s">HWE.3对设计验证；HWE.4对需求验证</text><text x="53" y="967" class="s">硬件成果回到SYS.4，与软件及其他要素集成</text><rect x="650" y="885" width="595" height="105" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="668" y="915" class="b">机器学习分支：SWE → MLE.1～MLE.4</text><text x="668" y="941" class="s">SUP.11管理数据；成果回到软件/系统集成</text><text x="668" y="967" class="s">无ML功能时记录不适用理由</text><rect x="35" y="1015" width="1210" height="80" rx="12" fill="#e5f4ea" stroke="#b4c2d3"/><text x="53" y="1045" class="b">SPL.2 产品发布：依据发布准则批准，交付明确的受控基线</text><text x="53" y="1071" class="s">交付包关联需求、设计、实现、环境、验证结果与已知问题</text><text x="35" y="1130" class="small">图例：橙色＝开发　蓝色＝验证/证据　绿色＝受控发布　虚线＝验证依据/追溯</text><text x="35" y="1160" class="small">注意：各验证规格提前准备；活动可并行迭代。此图不规定标准强制生命周期。</text></svg>