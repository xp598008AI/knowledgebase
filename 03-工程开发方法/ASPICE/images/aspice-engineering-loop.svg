<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
<defs><style>
.title{font:700 30px Arial,'Noto Sans CJK SC',sans-serif;fill:#16324f}.sub{font:16px Arial,'Noto Sans CJK SC',sans-serif;fill:#425466}
.h{font:700 19px Arial,'Noto Sans CJK SC',sans-serif;fill:#16324f}.t{font:15px Arial,'Noto Sans CJK SC',sans-serif;fill:#243746}.small{font:13px Arial,'Noto Sans CJK SC',sans-serif;fill:#425466}
.box{fill:#f4f8fc;stroke:#4677a8;stroke-width:2;rx:12}.verify{fill:#f1f8f2;stroke:#4b8b63;stroke-width:2;rx:12}.support{fill:#fff7e8;stroke:#b98430;stroke-width:2;rx:12}.arrow{stroke:#536b82;stroke-width:2.4;fill:none;marker-end:url(#arr)}.dash{stroke:#b98430;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arr2)}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536b82"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b98430"/></marker></defs>
<rect width="1440" height="940" fill="#ffffff"/>
<text x="720" y="48" text-anchor="middle" class="title">ASPICE 工程闭环：从需求到验证，再到可审查证据</text>
<text x="720" y="78" text-anchor="middle" class="sub">学习示意图｜具体过程名称与编号以项目采用的 PAM 版本为准</text>
<text x="280" y="125" text-anchor="middle" class="h">需求分解与设计（左侧）</text><text x="1110" y="125" text-anchor="middle" class="h">验证与确认（右侧）</text>
<rect x="80" y="150" width="400" height="78" class="box"/><text x="280" y="180" text-anchor="middle" class="h">利益相关方 / 系统需求</text><text x="280" y="205" text-anchor="middle" class="t">来源、约束、验收准则、唯一 ID</text>
<rect x="80" y="275" width="400" height="78" class="box"/><text x="280" y="305" text-anchor="middle" class="h">系统架构与需求分配</text><text x="280" y="330" text-anchor="middle" class="t">系统元素、软硬件分配、接口</text>
<rect x="80" y="400" width="400" height="78" class="box"/><text x="280" y="430" text-anchor="middle" class="h">软件需求与软件架构</text><text x="280" y="455" text-anchor="middle" class="t">功能、性能、状态机、异常路径</text>
<rect x="80" y="525" width="400" height="78" class="box"/><text x="280" y="555" text-anchor="middle" class="h">详细设计与实现</text><text x="280" y="580" text-anchor="middle" class="t">模块接口、代码、配置、静态检查</text>
<rect x="80" y="650" width="400" height="78" class="box"/><text x="280" y="680" text-anchor="middle" class="h">单元验证 / 实现证据</text><text x="280" y="705" text-anchor="middle" class="t">测试结果、代码版本、缺陷记录</text>
<path d="M280 228 V275 M280 353 V400 M280 478 V525 M280 603 V650" class="arrow"/>
<rect x="900" y="150" width="430" height="78" class="verify"/><text x="1115" y="180" text-anchor="middle" class="h">系统验证 / 确认</text><text x="1115" y="205" text-anchor="middle" class="t">系统需求覆盖、场景与验收结果</text>
<rect x="900" y="275" width="430" height="78" class="verify"/><text x="1115" y="305" text-anchor="middle" class="h">系统集成与接口验证</text><text x="1115" y="330" text-anchor="middle" class="t">软硬件协同、接口、系统行为</text>
<rect x="900" y="400" width="430" height="78" class="verify"/><text x="1115" y="430" text-anchor="middle" class="h">软件验证 / 集成验证</text><text x="1115" y="455" text-anchor="middle" class="t">需求验证、集成行为、回归测试</text>
<rect x="900" y="525" width="430" height="78" class="verify"/><text x="1115" y="555" text-anchor="middle" class="h">单元测试 / 静态分析</text><text x="1115" y="580" text-anchor="middle" class="t">边界、异常、覆盖与分析结果</text>
<path d="M900 189 H780 V314 H480 M900 314 H810 V439 H480 M900 439 H840 V564 H480 M900 564 H870 V689 H480" class="arrow"/>
<rect x="80" y="780" width="1250" height="100" class="support"/>
<text x="705" y="812" text-anchor="middle" class="h">贯穿全生命周期的管理与支持机制</text>
<text x="705" y="842" text-anchor="middle" class="t">MAN：计划、监控、风险、协作　｜　SUP：质量保证、配置/基线、问题解决、变更控制</text>
<text x="705" y="864" text-anchor="middle" class="t">核心证据链：需求 ID ↔ 设计/接口 ↔ 实现版本 ↔ 测试用例/结果 ↔ 缺陷与变更闭环</text>
<path d="M480 815 H520" class="dash"/><path d="M900 815 H860" class="dash"/>
<text x="720" y="920" text-anchor="middle" class="small">注意：概念图用于培训与项目讨论，不是官方 PAM 流程图，也不构成正式评估判定。</text>
</svg>