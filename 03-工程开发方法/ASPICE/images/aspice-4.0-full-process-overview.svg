<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      .title{font:700 34px Arial,"Noto Sans SC",sans-serif;fill:#111827}.sub{font:500 17px Arial,"Noto Sans SC",sans-serif;fill:#4B5563}.h2{font:700 22px Arial,"Noto Sans SC",sans-serif;fill:#111827}.txt{font:600 16px Arial,"Noto Sans SC",sans-serif;fill:#111827}.sm{font:500 13px Arial,"Noto Sans SC",sans-serif;fill:#374151}.xs{font:500 12px Arial,"Noto Sans SC",sans-serif;fill:#4B5563}.node{rx:14;ry:14;stroke-width:2}.arrow{stroke:#374151;stroke-width:2.2;fill:none;marker-end:url(#m)}.dash{stroke:#6B7280;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#m2)}.support{stroke:#B91C1C;stroke-width:2;fill:none;stroke-dasharray:5 5;marker-end:url(#m3)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6B7280"/></marker>
    <marker id="m3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B91C1C"/></marker>
  </defs>

  <rect width="1800" height="1220" fill="#F9FAFB"/>
  <text x="900" y="54" text-anchor="middle" class="title">Automotive SPICE 4.0 全流程总览：过程组、主流转与治理闭环</text>
  <text x="900" y="84" text-anchor="middle" class="sub">学习/实践视图：覆盖完整 PRM 过程集合；箭头表示典型信息流与反馈，不代表强制时序</text>

  <!-- Scope legend -->
  <g transform="translate(78,108)">
    <rect x="0" y="0" width="1644" height="66" rx="14" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="24" y="27" class="txt">推荐 VDA Scope 视角</text>
    <circle cx="260" cy="24" r="11" fill="#2563EB"/><text x="280" y="29" class="sm">B = Base 基础过程</text>
    <circle cx="480" cy="24" r="11" fill="#7C3AED"/><text x="500" y="29" class="sm">P = Plug-in 工程过程</text>
    <circle cx="735" cy="24" r="11" fill="#D97706"/><text x="755" y="29" class="sm">F = Flex / Optional</text>
    <text x="1005" y="29" class="sm">颜色语义：蓝=需求/设计　紫=实现/工程　绿=验证/发布　橙=范围/门禁　红=问题/变更　灰=管理/组织</text>
    <text x="24" y="53" class="xs">注意：项目实际评估范围必须依据评估目的、合同要求和裁剪理由确定；此图不替代 PAM/PRM 原文。</text>
  </g>

  <!-- Inputs -->
  <g transform="translate(70,205)">
    <rect class="node" x="0" y="0" width="220" height="78" fill="#FFF7ED" stroke="#D97706"/>
    <text x="110" y="29" text-anchor="middle" class="txt">客户 / 利益相关方</text><text x="110" y="53" text-anchor="middle" class="sm">需求、法规、合同、业务目标</text>
    <rect class="node" x="250" y="0" width="220" height="78" fill="#FFF7ED" stroke="#D97706"/>
    <text x="360" y="29" text-anchor="middle" class="txt">ACQ.4 供应商监控</text><text x="360" y="53" text-anchor="middle" class="sm">F｜供方进度/质量/问题</text>
    <rect class="node" x="500" y="0" width="220" height="78" fill="#F3F4F6" stroke="#6B7280"/>
    <text x="610" y="29" text-anchor="middle" class="txt">MAN.3 项目管理</text><text x="610" y="53" text-anchor="middle" class="sm">B｜计划、监控、里程碑</text>
    <rect class="node" x="750" y="0" width="220" height="78" fill="#F3F4F6" stroke="#6B7280"/>
    <text x="860" y="29" text-anchor="middle" class="txt">MAN.5 风险管理</text><text x="860" y="53" text-anchor="middle" class="sm">F｜风险识别、处置、跟踪</text>
    <rect class="node" x="1000" y="0" width="220" height="78" fill="#F3F4F6" stroke="#6B7280"/>
    <text x="1110" y="29" text-anchor="middle" class="txt">MAN.6 度量</text><text x="1110" y="53" text-anchor="middle" class="sm">F｜目标、指标、分析</text>
    <rect class="node" x="1250" y="0" width="220" height="78" fill="#F3F4F6" stroke="#6B7280"/>
    <text x="1360" y="29" text-anchor="middle" class="txt">PIM.3 过程改进</text><text x="1360" y="53" text-anchor="middle" class="sm">B｜组织级持续改进</text>
    <rect class="node" x="1500" y="0" width="220" height="78" fill="#F3F4F6" stroke="#6B7280"/>
    <text x="1610" y="29" text-anchor="middle" class="txt">REU.2 产品复用管理</text><text x="1610" y="53" text-anchor="middle" class="sm">B｜复用资产与准入</text>
  </g>

  <!-- Main engineering area -->
  <rect x="70" y="320" width="1310" height="650" rx="18" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="95" y="354" class="h2">主要生命周期 / 工程主链</text>

  <!-- SYS -->
  <g>
    <rect x="100" y="385" width="1240" height="120" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <text x="120" y="414" class="txt">SYS 系统工程</text>
    <rect class="node" x="135" y="432" width="190" height="52" fill="#DBEAFE" stroke="#2563EB"/><text x="230" y="454" text-anchor="middle" class="txt">SYS.1 需求获取</text><text x="230" y="474" text-anchor="middle" class="xs">F｜利益相关方需求入口</text>
    <rect class="node" x="350" y="432" width="190" height="52" fill="#DBEAFE" stroke="#2563EB"/><text x="445" y="454" text-anchor="middle" class="txt">SYS.2 系统需求分析</text><text x="445" y="474" text-anchor="middle" class="xs">P｜系统需求基线</text>
    <rect class="node" x="565" y="432" width="190" height="52" fill="#DBEAFE" stroke="#2563EB"/><text x="660" y="454" text-anchor="middle" class="txt">SYS.3 系统架构设计</text><text x="660" y="474" text-anchor="middle" class="xs">P｜元素/接口/分配</text>
    <rect class="node" x="860" y="432" width="190" height="52" fill="#D1FAE5" stroke="#059669"/><text x="955" y="454" text-anchor="middle" class="txt">SYS.4 系统集成验证</text><text x="955" y="474" text-anchor="middle" class="xs">P｜架构与接口证据</text>
    <rect class="node" x="1075" y="432" width="190" height="52" fill="#D1FAE5" stroke="#059669"/><text x="1170" y="454" text-anchor="middle" class="txt">SYS.5 系统验证</text><text x="1170" y="474" text-anchor="middle" class="xs">P｜系统需求验证</text>
  </g>

  <!-- SWE -->
  <g>
    <rect x="100" y="525" width="610" height="220" rx="16" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/>
    <text x="120" y="554" class="txt">SWE 软件工程</text>
    <rect class="node" x="125" y="575" width="170" height="56" fill="#EDE9FE" stroke="#7C3AED"/><text x="210" y="598" text-anchor="middle" class="txt">SWE.1 软件需求</text><text x="210" y="619" text-anchor="middle" class="xs">P｜需求分析</text>
    <rect class="node" x="315" y="575" width="170" height="56" fill="#EDE9FE" stroke="#7C3AED"/><text x="400" y="598" text-anchor="middle" class="txt">SWE.2 软件架构</text><text x="400" y="619" text-anchor="middle" class="xs">P｜组件/接口</text>
    <rect class="node" x="505" y="575" width="170" height="56" fill="#EDE9FE" stroke="#7C3AED"/><text x="590" y="598" text-anchor="middle" class="txt">SWE.3 详细设计/构建</text><text x="590" y="619" text-anchor="middle" class="xs">P｜设计/代码</text>
    <rect class="node" x="505" y="655" width="170" height="56" fill="#D1FAE5" stroke="#059669"/><text x="590" y="678" text-anchor="middle" class="txt">SWE.4 单元验证</text><text x="590" y="699" text-anchor="middle" class="xs">P｜详细设计符合性</text>
    <rect class="node" x="315" y="655" width="170" height="56" fill="#D1FAE5" stroke="#059669"/><text x="400" y="678" text-anchor="middle" class="txt">SWE.5 集成验证</text><text x="400" y="699" text-anchor="middle" class="xs">P｜架构/接口符合性</text>
    <rect class="node" x="125" y="655" width="170" height="56" fill="#D1FAE5" stroke="#059669"/><text x="210" y="678" text-anchor="middle" class="txt">SWE.6 软件验证</text><text x="210" y="699" text-anchor="middle" class="xs">P｜软件需求符合性</text>
  </g>

  <!-- HWE -->
  <g>
    <rect x="730" y="525" width="610" height="220" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="750" y="554" class="txt">HWE 硬件工程</text>
    <rect class="node" x="755" y="575" width="170" height="56" fill="#FFEDD5" stroke="#EA580C"/><text x="840" y="598" text-anchor="middle" class="txt">HWE.1 硬件需求</text><text x="840" y="619" text-anchor="middle" class="xs">P｜需求分析</text>
    <rect class="node" x="950" y="575" width="170" height="56" fill="#FFEDD5" stroke="#EA580C"/><text x="1035" y="598" text-anchor="middle" class="txt">HWE.2 硬件设计</text><text x="1035" y="619" text-anchor="middle" class="xs">P｜架构/电路/约束</text>
    <rect class="node" x="1145" y="655" width="170" height="56" fill="#D1FAE5" stroke="#059669"/><text x="1230" y="678" text-anchor="middle" class="txt">HWE.3 设计验证</text><text x="1230" y="699" text-anchor="middle" class="xs">P｜对硬件设计验证</text>
    <rect class="node" x="950" y="655" width="170" height="56" fill="#D1FAE5" stroke="#059669"/><text x="1035" y="678" text-anchor="middle" class="txt">HWE.4 需求验证</text><text x="1035" y="699" text-anchor="middle" class="xs">P｜对硬件需求验证</text>
  </g>

  <!-- MLE -->
  <g>
    <rect x="100" y="765" width="1240" height="105" rx="16" fill="#FAF5FF" stroke="#C084FC" stroke-width="2"/>
    <text x="120" y="793" class="txt">MLE 机器学习工程</text>
    <rect class="node" x="190" y="805" width="210" height="48" fill="#F3E8FF" stroke="#9333EA"/><text x="295" y="835" text-anchor="middle" class="txt">MLE.1 ML 需求分析</text>
    <rect class="node" x="455" y="805" width="210" height="48" fill="#F3E8FF" stroke="#9333EA"/><text x="560" y="835" text-anchor="middle" class="txt">MLE.2 ML 架构</text>
    <rect class="node" x="720" y="805" width="210" height="48" fill="#F3E8FF" stroke="#9333EA"/><text x="825" y="835" text-anchor="middle" class="txt">MLE.3 ML 训练</text>
    <rect class="node" x="985" y="805" width="210" height="48" fill="#D1FAE5" stroke="#059669"/><text x="1090" y="835" text-anchor="middle" class="txt">MLE.4 ML 模型测试</text>
  </g>

  <!-- Validation & release -->
  <g>
    <rect class="node" x="100" y="895" width="290" height="58" fill="#D1FAE5" stroke="#059669"/><text x="245" y="919" text-anchor="middle" class="txt">VAL.1 产品确认 Validation</text><text x="245" y="940" text-anchor="middle" class="xs">F｜预期用途 / 利益相关方期望</text>
    <rect class="node" x="425" y="895" width="290" height="58" fill="#D1FAE5" stroke="#059669"/><text x="570" y="919" text-anchor="middle" class="txt">SPL.2 产品发布</text><text x="570" y="940" text-anchor="middle" class="xs">B｜版本、发布包、交付证据</text>
    <rect class="node" x="750" y="895" width="560" height="58" fill="#ECFDF5" stroke="#10B981"/><text x="1030" y="919" text-anchor="middle" class="txt">交付 / 量产 / 现场反馈</text><text x="1030" y="940" text-anchor="middle" class="xs">质量数据、缺陷、变更请求、度量结果反哺项目与过程改进</text>
  </g>

  <!-- Support rail -->
  <g>
    <rect x="1410" y="320" width="320" height="650" rx="18" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
    <text x="1570" y="354" text-anchor="middle" class="h2">SUP 支持生命周期过程</text>
    <rect class="node" x="1445" y="390" width="250" height="68" fill="#FFFFFF" stroke="#B91C1C"/><text x="1570" y="418" text-anchor="middle" class="txt">SUP.1 质量保证</text><text x="1570" y="441" text-anchor="middle" class="xs">B｜独立检查过程与工作产品</text>
    <rect class="node" x="1445" y="480" width="250" height="68" fill="#FFFFFF" stroke="#B91C1C"/><text x="1570" y="508" text-anchor="middle" class="txt">SUP.8 配置管理</text><text x="1570" y="531" text-anchor="middle" class="xs">B｜基线、版本、状态控制</text>
    <rect class="node" x="1445" y="570" width="250" height="68" fill="#FFFFFF" stroke="#B91C1C"/><text x="1570" y="598" text-anchor="middle" class="txt">SUP.9 问题解决管理</text><text x="1570" y="621" text-anchor="middle" class="xs">B｜问题→分析→措施→关闭</text>
    <rect class="node" x="1445" y="660" width="250" height="68" fill="#FFFFFF" stroke="#B91C1C"/><text x="1570" y="688" text-anchor="middle" class="txt">SUP.10 变更请求管理</text><text x="1570" y="711" text-anchor="middle" class="xs">B｜变更→影响→批准→回归</text>
    <rect class="node" x="1445" y="750" width="250" height="68" fill="#FFFFFF" stroke="#B91C1C"/><text x="1570" y="778" text-anchor="middle" class="txt">SUP.11 ML 数据管理</text><text x="1570" y="801" text-anchor="middle" class="xs">B｜数据集版本、质量、追溯</text>
    <rect x="1445" y="850" width="250" height="86" rx="12" fill="#FFF7ED" stroke="#D97706"/>
    <text x="1570" y="878" text-anchor="middle" class="txt">贯穿式治理</text>
    <text x="1570" y="901" text-anchor="middle" class="xs">质量 / 配置 / 问题 / 变更</text>
    <text x="1570" y="921" text-anchor="middle" class="xs">持续作用于所有工程与发布过程</text>
  </g>

