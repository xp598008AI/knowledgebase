  <!-- Bottom explanatory loop -->
  <g transform="translate(70,1000)">
    <rect x="0" y="0" width="1660" height="150" rx="18" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="25" y="34" class="h2">一眼看懂流转逻辑</text>
    <text x="25" y="66" class="txt">① 需求与项目约束进入 SYS / 工程域 → ② 系统分配到软件、硬件、ML → ③ 各域设计/实现 → ④ 分层验证与系统集成 → ⑤ VAL.1 确认预期用途 → ⑥ SPL.2 发布交付</text>
    <text x="25" y="96" class="txt">⑦ SUP 全程控制质量、配置、问题、变更；MAN 管理计划/风险/度量；现场与度量数据回流到项目管理和 PIM.3 过程改进，形成持续闭环。</text>
    <text x="25" y="128" class="sm">核心证据链：利益相关方需求 ↔ 系统需求 ↔ 架构 ↔ 软件/硬件/ML 工作产品 ↔ 验证用例与结果 ↔ 缺陷/变更 ↔ 基线 ↔ 发布版本。</text>
  </g>
