<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1025" viewBox="0 0 2400 1025"><title>机器学习与数据：输入输出与评审点</title><desc>覆盖32过程。每卡包含目的、输入、输出、流向及建议评审点。工程概念示意，Draft。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#59677c" /></marker></defs><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><rect width="2400" height="1025" fill="#f5f7fb" /><text x="45" y="51" font-size="38" fill="#7659ad" font-weight="700" id="txt0">04  机器学习与数据</text><text x="45" y="94" font-size="25" fill="#263449" font-weight="600" id="txt1">SWE需求/架构 → MLE.1 → MLE.2 → MLE.3 → MLE.4 → SWE.5/SWE.6</text><text x="45" y="132" font-size="22" fill="#526276" font-weight="400" id="txt2">SUP.11 ↔ MLE.1～4（按需）；模型/数据版本 → SUP.8。没有ML功能时记录不适用理由。</text><rect x="45.0" y="165" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="165" width="7" height="350" rx="3" fill="#7659ad" /><text x="67.0" y="201" font-size="29" fill="#7659ad" font-weight="700" id="txt3">MLE.1</text><text x="67.0" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt4">机器学习需求分析</text><text x="67.0" y="277" font-size="23" fill="#263449" font-weight="700" id="txt5">目的</text><text x="130.0" y="277" font-size="25" fill="#263449" font-weight="400" id="txt6">定义模型功能、性能和运行边界</text><text x="67.0" y="315" font-size="23" fill="#526276" font-weight="700" id="txt7">输入</text><text x="130.0" y="315" font-size="25" fill="#526276" font-weight="400" id="txt8">软件需求、场景、数据条件</text><text x="67.0" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt9">输出</text><text x="130.0" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt10">ML需求规格、指标与分析</text><text x="67.0" y="442" font-size="22" fill="#7659ad" font-weight="500" id="txt11">→ MLE.2；MLE.4；SUP.11</text><rect x="61.0" y="460" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 470L88.0 480L78.0 490L68.0 480Z" fill="#c64132" /><text x="96.0" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt12">R18 运行边界与验收指标</text><rect x="826.6666666666666" y="165" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="826.6666666666666" y="165" width="7" height="350" rx="3" fill="#7659ad" /><text x="848.6666666666666" y="201" font-size="29" fill="#7659ad" font-weight="700" id="txt13">MLE.2</text><text x="848.6666666666666" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt14">机器学习架构</text><text x="848.6666666666666" y="277" font-size="23" fill="#263449" font-weight="700" id="txt15">目的</text><text x="911.6666666666666" y="277" font-size="25" fill="#263449" font-weight="400" id="txt16">定义模型、特征及训练/推理接口</text><text x="848.6666666666666" y="315" font-size="23" fill="#526276" font-weight="700" id="txt17">输入</text><text x="911.6666666666666" y="315" font-size="25" fill="#526276" font-weight="400" id="txt18">ML需求、数据特征、算力约束</text><text x="848.6666666666666" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt19">输出</text><text x="911.6666666666666" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt20">ML架构、接口、模型选择分析</text><text x="848.6666666666666" y="442" font-size="22" fill="#7659ad" font-weight="500" id="txt21">→ MLE.3；SUP.11</text><rect x="842.6666666666666" y="460" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M859.6666666666666 470L869.6666666666666 480L859.6666666666666 490L849.6666666666666 480Z" fill="#c64132" /><text x="877.6666666666666" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt22">R19 模型方案、接口与资源</text><rect x="1608.3333333333333" y="165" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="1608.3333333333333" y="165" width="7" height="350" rx="3" fill="#7659ad" /><text x="1630.3333333333333" y="201" font-size="29" fill="#7659ad" font-weight="700" id="txt23">MLE.3</text><text x="1630.3333333333333" y="238" font-size="26" fill="#172c46" font-weight="700" id="txt24">机器学习训练</text><text x="1630.3333333333333" y="277" font-size="23" fill="#263449" font-weight="700" id="txt25">目的</text><text x="1693.3333333333333" y="277" font-size="25" fill="#263449" font-weight="400" id="txt26">受控且可重现地形成训练模型</text><text x="1630.3333333333333" y="315" font-size="23" fill="#526276" font-weight="700" id="txt27">输入</text><text x="1693.3333333333333" y="315" font-size="25" fill="#526276" font-weight="400" id="txt28">ML架构、受控数据、训练配置</text><text x="1630.3333333333333" y="353" font-size="23" fill="#16765b" font-weight="700" id="txt29">输出</text><text x="1693.3333333333333" y="353" font-size="25" fill="#16765b" font-weight="400" id="txt30">模型、训练脚本/配置与日志</text><text x="1630.3333333333333" y="442" font-size="22" fill="#7659ad" font-weight="500" id="txt31">→ MLE.4；SUP.8</text><rect x="1624.3333333333333" y="460" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M1641.3333333333333 470L1651.3333333333333 480L1641.3333333333333 490L1631.3333333333333 480Z" fill="#c64132" /><text x="1659.3333333333333" y="487" font-size="21" fill="#a92f25" font-weight="600" id="txt32">R20 数据/配置身份与重现性</text><rect x="45.0" y="555" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="45.0" y="555" width="7" height="350" rx="3" fill="#7659ad" /><text x="67.0" y="591" font-size="29" fill="#7659ad" font-weight="700" id="txt33">MLE.4</text><text x="67.0" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt34">机器学习模型测试</text><text x="67.0" y="667" font-size="23" fill="#263449" font-weight="700" id="txt35">目的</text><text x="130.0" y="667" font-size="25" fill="#263449" font-weight="400" id="txt36">对模型需求验证性能及失效边界</text><text x="67.0" y="705" font-size="23" fill="#526276" font-weight="700" id="txt37">输入</text><text x="130.0" y="705" font-size="25" fill="#526276" font-weight="400" id="txt38">ML需求、模型、独立测试数据</text><text x="67.0" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt39">输出</text><text x="130.0" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt40">模型测试报告、覆盖/失效分析</text><text x="67.0" y="832" font-size="22" fill="#7659ad" font-weight="500" id="txt41">→ SWE.5/SWE.6；SUP.9</text><rect x="61.0" y="850" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M78.0 860L88.0 870L78.0 880L68.0 870Z" fill="#c64132" /><text x="96.0" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt42">R21 独立数据、指标与边界</text><rect x="826.6666666666666" y="555" width="746.6666666666666" height="350" rx="16" fill="#ffffff" stroke="#d5ddea" /><rect x="826.6666666666666" y="555" width="7" height="350" rx="3" fill="#7659ad" /><text x="848.6666666666666" y="591" font-size="29" fill="#7659ad" font-weight="700" id="txt43">SUP.11</text><text x="848.6666666666666" y="628" font-size="26" fill="#172c46" font-weight="700" id="txt44">机器学习数据管理</text><text x="848.6666666666666" y="667" font-size="23" fill="#263449" font-weight="700" id="txt45">目的</text><text x="911.6666666666666" y="667" font-size="25" fill="#263449" font-weight="400" id="txt46">管理数据质量、划分与完整生命周期</text><text x="848.6666666666666" y="705" font-size="23" fill="#526276" font-weight="700" id="txt47">输入</text><text x="911.6666666666666" y="705" font-size="25" fill="#526276" font-weight="400" id="txt48">数据需求、来源、质量规则</text><text x="848.6666666666666" y="743" font-size="23" fill="#16765b" font-weight="700" id="txt49">输出</text><text x="911.6666666666666" y="743" font-size="25" fill="#16765b" font-weight="400" id="txt50">数据集清单、标注/质量/版本</text><text x="848.6666666666666" y="832" font-size="22" fill="#7659ad" font-weight="500" id="txt51">→ MLE.1～4（按需）；SUP.8</text><rect x="842.6666666666666" y="850" width="714.6666666666666" height="40" rx="8" fill="#fff2f0" stroke="#fec9c1" /><path d="M859.6666666666666 860L869.6666666666666 870L859.6666666666666 880L849.6666666666666 870Z" fill="#c64132" /><text x="877.6666666666666" y="877" font-size="21" fill="#a92f25" font-weight="600" id="txt52">R22 质量、代表性与数据泄漏</text><path d="M794.6666666666666 340L821.6666666666666 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M1576.3333333333333 340L1603.3333333333333 340" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><path d="M1981.6666666666665 518L1981.6666666666665 535L418.3333333333333 535L418.3333333333333 550" fill="none" stroke="#59677c" stroke-width="3" marker-end="url(#arr)" /><text x="45" y="1009" font-size="22" fill="#a92f25" font-weight="500" id="txt53">◇ R01～R32：建议工程评审/决策点；并非标准强制门禁或已完成审批。</text></g></svg>