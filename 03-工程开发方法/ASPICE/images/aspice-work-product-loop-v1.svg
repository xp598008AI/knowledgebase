<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1070" viewBox="0 0 1250 1070"><title>ASPICE工作产品流转与变更闭环</title><desc>原创工程概念示意，Draft；蓝色证据，橙色开发，绿色基线与发布，红色反馈。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526279"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#213047} .hd{font-size:28px;font-weight:700}.small{font-size:17px}.b{font-size:21px;font-weight:600}.s{font-size:18px} .ar{fill:none;stroke:#526279;stroke-width:2;marker-end:url(#a)}</style><rect width="100%" height="100%" fill="#f6f8fb"/><text x="35" y="48" class="hd">ASPICE工作产品流转：每次交接都有版本与证据</text><text x="35" y="82" class="small">原创项目工作流｜v1 · 2026-10-13 · Draft｜可按功能增量重复</text><rect x="35" y="130" width="670" height="95" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="160" class="b">1 接受输入</text><text x="53" y="186" class="s">来源、范围、版本、约束与接受准则</text><path class="ar"  d="M370 227L370 271"/><rect x="35" y="275" width="670" height="95" rx="12" fill="#fff1e5" stroke="#b4c2d3"/><text x="53" y="305" class="b">2 需求与设计</text><text x="53" y="331" class="s">需求分配、接口、异常；同步设计验证规格</text><path class="ar"  d="M370 372L370 416"/><rect x="35" y="420" width="670" height="95" rx="12" fill="#e5f4ea" stroke="#b4c2d3"/><text x="53" y="450" class="b">3 评审与受控基线</text><text x="53" y="476" class="s">问题处置、决定、责任人与配置项</text><path class="ar"  d="M370 517L370 561"/><rect x="35" y="565" width="670" height="95" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="53" y="595" class="b">4 实现与分层验证</text><text x="53" y="621" class="s">构建 → 单元/组件 → 软件/硬件 → 系统</text><path class="ar"  d="M370 662L370 706"/><rect x="35" y="710" width="670" height="95" rx="12" fill="#e5f4ea" stroke="#b4c2d3"/><text x="53" y="740" class="b">5 确认与发布</text><text x="53" y="766" class="s">预期使用证据、已知问题、批准与交付</text><rect x="790" y="285" width="420" height="115" rx="12" fill="#fdebea" stroke="#b4c2d3"/><text x="808" y="315" class="b">发现问题 SUP.9</text><text x="808" y="341" class="s">复现 → 分类 → 根因 → 措施</text><text x="808" y="367" class="s">记录对象版本及原始证据</text><rect x="790" y="435" width="420" height="115" rx="12" fill="#fdebea" stroke="#b4c2d3"/><text x="808" y="465" class="b">必要变更 SUP.10</text><text x="808" y="491" class="s">影响分析 → 审批 → 实施</text><text x="808" y="517" class="s">拒绝/暂缓：记录决定与理由</text><rect x="790" y="585" width="420" height="115" rx="12" fill="#e7f1ff" stroke="#b4c2d3"/><text x="808" y="615" class="b">修复与回归</text><text x="808" y="641" class="s">检查修改结果及关联影响</text><text x="808" y="667" class="s">更新证据、基线、通知与关闭</text><path class="ar"  d="M710 612L775 345"/><path class="ar"  d="M1000 402L1000 430"/><path class="ar"  d="M1000 552L1000 580"/><path class="ar" d="M790 480L740 480L740 320L710 320"/><text x="758" y="260" class="small">反馈闭环</text><rect x="35" y="895" width="1175" height="100" rx="12" fill="#e8eef8" stroke="#b4c2d3"/><text x="53" y="925" class="b">每次交接最小记录：对象ID · 依据版本 · 状态 · 责任 · 评审决定 · 证据位置</text><text x="53" y="951" class="s">SUP.8配置保证身份；SUP.1检查符合性；MAN协调计划/风险/度量；ACQ.4协调供应商</text><text x="35" y="1040" class="small">图例：橙色＝技术活动　蓝色＝验证证据　绿色＝基线/发布　红色＝问题/变更</text></svg>