<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">技术图片自动归档流程示意图</title>
<desc id="desc">图片与元数据进入待归档队列，自动校验，归档图片，更新 Markdown 和索引，再运行 CI 检查。</desc>
<rect width="1200" height="360" rx="20" fill="#f5f7fb"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#182230">技术图片自动归档流水线</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="35" y="100" width="190" height="110" rx="14" fill="#e0ecff" stroke="#527fc3" stroke-width="2"/>
<text x="130" y="140" font-size="18" font-weight="700" fill="#173e78">1. 待归档队列</text><text x="130" y="170" font-size="14" fill="#173e78">图片 + JSON 元数据</text>
<rect x="270" y="100" width="190" height="110" rx="14" fill="#e6f6ed" stroke="#4b9a70" stroke-width="2"/>
<text x="365" y="140" font-size="18" font-weight="700" fill="#155b38">2. 自动校验</text><text x="365" y="170" font-size="14" fill="#155b38">路径、格式、大小</text>
<rect x="505" y="100" width="190" height="110" rx="14" fill="#fff0d8" stroke="#c58a35" stroke-width="2"/>
<text x="600" y="140" font-size="18" font-weight="700" fill="#75480e">3. 归档图片</text><text x="600" y="170" font-size="14" fill="#75480e">目标文档 images/</text>
<rect x="740" y="100" width="190" height="110" rx="14" fill="#efe6ff" stroke="#8b6ac7" stroke-width="2"/>
<text x="835" y="140" font-size="18" font-weight="700" fill="#4c2c84">4. 更新文档</text><text x="835" y="170" font-size="14" fill="#4c2c84">插图说明、资产索引</text>
<rect x="975" y="100" width="190" height="110" rx="14" fill="#dff5f4" stroke="#3b9992" stroke-width="2"/>
<text x="1070" y="140" font-size="18" font-weight="700" fill="#155d59">5. CI 验证</text><text x="1070" y="170" font-size="14" fill="#155d59">图片引用与本地链接</text>
<g stroke="#4b5563" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M225 155 H258"/><path d="M250 147 L260 155 L250 163"/>
<path d="M460 155 H493"/><path d="M485 147 L495 155 L485 163"/>
<path d="M695 155 H728"/><path d="M720 147 L730 155 L720 163"/>
<path d="M930 155 H963"/><path d="M955 147 L965 155 L955 163"/>
</g>
<text x="600" y="270" font-size="16" fill="#364152">人工只需准备图片与元数据、复核技术内容；归档动作和路径检查由流水线完成。</text>
<text x="600" y="302" font-size="13" fill="#596579">概念示意图 · 不代表任何标准规范或实测证据</text>
</g>
</svg>