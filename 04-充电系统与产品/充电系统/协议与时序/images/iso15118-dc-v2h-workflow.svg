<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ISO 15118-20 DC V2H 系统与通信协同示意图</title>
  <desc id="desc">概念性展示车辆电池与双向直流功率通道、EVCC 与 SECC 的 ISO 15118-20 通信，以及 EVSE 到家庭能源系统的双向能量流。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#172033}
      .h1{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}
      .head{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.vehicle{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}
      .evse{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.home{fill:#fff7ed;stroke:#fb923c;stroke-width:2}
      .comm{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#arrow-blue)}
      .power{fill:none;stroke:#15803d;stroke-width:5;marker-end:url(#arrow-green)}
      .bi{fill:none;stroke:#15803d;stroke-width:4;marker-start:url(#arrow-green);marker-end:url(#arrow-green)}
      .thin{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow-gray)}
    </style>
  </defs>
  <rect width="1400" height="820" rx="22" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" class="h1">ISO 15118-20 DC V2H：系统与通信协同</text>
  <text x="700" y="86" text-anchor="middle" class="sub">概念架构图｜通信控制链与双向功率链分层展示｜非规范性时序或合规性声明</text>

  <rect x="48" y="120" width="1304" height="230" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="76" y="155" class="head" fill="#1d4ed8">A. 通信与控制层（ISO 15118-20）</text>
  <rect x="88" y="183" width="300" height="112" rx="14" class="vehicle"/>
  <text x="238" y="218" text-anchor="middle" class="head">车辆侧 EVCC</text>
  <text x="238" y="247" text-anchor="middle" class="body">会话管理 / 能力协商</text>
  <text x="238" y="271" text-anchor="middle" class="small">充放电参数与状态协调</text>

  <rect x="550" y="183" width="300" height="112" rx="14" class="evse"/>
  <text x="700" y="218" text-anchor="middle" class="head">充电设备侧 SECC</text>
  <text x="700" y="247" text-anchor="middle" class="body">通信会话 / 服务控制</text>
  <text x="700" y="271" text-anchor="middle" class="small">协调 EVSE 功率与安全条件</text>

  <rect x="1012" y="183" width="270" height="112" rx="14" class="home"/>
  <text x="1147" y="218" text-anchor="middle" class="head">能源管理控制</text>
  <text x="1147" y="247" text-anchor="middle" class="body">EMS / 功率目标</text>
  <text x="1147" y="271" text-anchor="middle" class="small">由系统实现定义接口</text>

  <path d="M388 224 H540" class="comm"/>
  <text x="464" y="207" text-anchor="middle" class="body" fill="#1d4ed8">PLC / HLC</text>
  <text x="464" y="250" text-anchor="middle" class="small">双向应用消息</text>
  <path d="M850 224 H1002" class="thin"/>
  <text x="926" y="207" text-anchor="middle" class="small">系统接口</text>
  <text x="926" y="250" text-anchor="middle" class="small">实现相关</text>

  <rect x="48" y="380" width="1304" height="280" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="76" y="416" class="head" fill="#166534">B. 直流功率与家庭能源层（V2H）</text>

  <rect x="80" y="452" width="250" height="150" rx="14" class="vehicle"/>
  <text x="205" y="486" text-anchor="middle" class="head">电动汽车</text>
  <text x="205" y="518" text-anchor="middle" class="body">高压动力电池</text>
  <text x="205" y="545" text-anchor="middle" class="body">BMS / 接触器</text>
  <text x="205" y="574" text-anchor="middle" class="small">电压、电流、SOC 与保护</text>

  <rect x="425" y="452" width="260" height="150" rx="14" class="card"/>
  <text x="555" y="486" text-anchor="middle" class="head">车辆直流接口</text>
  <text x="555" y="518" text-anchor="middle" class="body">充电连接器 / HV 互锁</text>
  <text x="555" y="545" text-anchor="middle" class="body">电压与电流监测</text>
  <text x="555" y="574" text-anchor="middle" class="small">具体实现依车辆与标准</text>

  <rect x="780" y="452" width="260" height="150" rx="14" class="evse"/>
  <text x="910" y="486" text-anchor="middle" class="head">双向 DC EVSE</text>
  <text x="910" y="518" text-anchor="middle" class="body">功率变换与直流调节</text>
  <text x="910" y="545" text-anchor="middle" class="body">保护 / 测量 / 控制</text>
  <text x="910" y="574" text-anchor="middle" class="small">功率拓扑由产品方案决定</text>

  <rect x="1120" y="452" width="190" height="150" rx="14" class="home"/>
  <text x="1215" y="486" text-anchor="middle" class="head">家庭侧</text>
  <text x="1215" y="518" text-anchor="middle" class="body">家庭负载</text>
  <text x="1215" y="545" text-anchor="middle" class="body">配电 / 电网接口</text>
  <text x="1215" y="574" text-anchor="middle" class="small">并网与防孤岛另行设计</text>

  <path d="M330 520 H415" class="bi"/>
  <path d="M685 520 H770" class="bi"/>
  <path d="M1040 520 H1110" class="bi"/>
  <text x="372" y="499" text-anchor="middle" class="small">DC</text>
  <text x="728" y="499" text-anchor="middle" class="small">DC</text>
  <text x="1075" y="499" text-anchor="middle" class="small">AC / DC</text>

  <path d="M238 295 V365 H700 V295" class="comm"/>
  <text x="470" y="355" text-anchor="middle" class="small" fill="#1d4ed8">会话协商与状态协调，不等同于功率流</text>

  <rect x="48" y="688" width="1304" height="88" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M82 720 H145" class="comm"/>
  <text x="160" y="726" class="body">通信 / 控制路径</text>
  <path d="M390 720 H453" class="bi"/>
  <text x="468" y="726" class="body">双向能量路径（示意）</text>
  <text x="820" y="718" class="small">工程核对重点：双向功率能力、保护联锁、</text>
  <text x="820" y="743" class="small">电网接口与适用标准版本需分别验证。</text>
  <text x="700" y="801" text-anchor="middle" class="small">状态：Draft｜用于系统讨论；不得替代 ISO 15118-20 原文、法规要求或产品安全设计。</text>
</svg>
