<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">EVCC通信超时处理状态机示意图</title>
  <desc id="desc">从IDLE进入MONITORING，有效通信刷新计时器；超时后进入TIMEOUT_PENDING和FAULT_HANDLING；满足入口条件后检查恢复，成功进入RECOVERED，失败保持故障；会话终止回到IDLE。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .node{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:16}
      .alert{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:16}
      .ok{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:16}
      .txt{font: bold 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .sub{font:14px Arial,sans-serif;fill:#334155;text-anchor:middle}
      .edge{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
      .label{font:14px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#ffffff"/>
  <text x="550" y="38" font-size="26" font-weight="bold" text-anchor="middle" fill="#0f172a">EVCC 通信超时处理状态机（示意）</text>
  <text x="550" y="62" font-size="14" text-anchor="middle" fill="#64748b">Draft：状态、时序与恢复策略必须由项目需求和设计评审确认</text>
  <rect class="node" x="70" y="130" width="170" height="78"/>
  <text class="txt" x="155" y="161">IDLE</text><text class="sub" x="155" y="185">未启用监控</text>
  <rect class="node" x="340" y="130" width="190" height="78"/>
  <text class="txt" x="435" y="161">MONITORING</text><text class="sub" x="435" y="185">监控有效通信</text>
  <rect class="alert" x="650" y="130" width="200" height="78"/>
  <text class="txt" x="750" y="161">TIMEOUT_PENDING</text><text class="sub" x="750" y="185">仲裁/发布超时事件</text>
  <rect class="alert" x="650" y="300" width="200" height="78"/>
  <text class="txt" x="750" y="331">FAULT_HANDLING</text><text class="sub" x="750" y="355">执行批准的异常策略</text>
  <rect class="node" x="340" y="300" width="190" height="78"/>
  <text class="txt" x="435" y="331">RECOVERY_CHECK</text><text class="sub" x="435" y="355">检查恢复前置条件</text>
  <rect class="ok" x="70" y="300" width="170" height="78"/>
  <text class="txt" x="155" y="331">RECOVERED</text><text class="sub" x="155" y="355">按定义恢复</text>
  <path class="edge" d="M240 169 L333 169"/><text class="label" x="255" y="153">进入监控阶段</text>
  <path class="edge" d="M530 153 L642 153"/><text class="label" x="545" y="136">计时器到期</text>
  <path class="edge" d="M435 208 L435 245 L435 270 L435 292"/><text class="label" x="445" y="247">有效活动：刷新计时器</text>
  <path class="edge" d="M750 208 L750 292"/><text class="label" x="762" y="254">事件确认</text>
  <path class="edge" d="M650 339 L538 339"/><text class="label" x="548" y="322">允许恢复检查</text>
  <path class="edge" d="M340 339 L248 339"/><text class="label" x="265" y="322">条件满足</text>
  <path class="edge" d="M435 300 L435 265 L570 265 L570 339 L642 339" stroke-dasharray="6 5"/>
  <text class="label" x="454" y="285">条件不满足：保持故障</text>
  <path class="edge" d="M155 300 L155 230 L155 215"/><text class="label" x="166" y="255">会话重启/新阶段</text>
  <path class="edge" d="M750 378 L750 440 L155 440 L155 386"/><text class="label" x="440" y="463">会话终止/复位：清理上下文并回到 IDLE</text>
  <rect x="70" y="515" width="960" height="85" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="92" y="542" font-size="16" font-weight="bold" fill="#0f172a">评审时必须明确</text>
  <text x="92" y="566" font-size="14" fill="#334155">有效活动定义、计时起点/重置规则、阈值与精度、并发事件优先级、重复事件抑制、恢复条件、输出策略和可观测性。</text>
  <text x="92" y="586" font-size="14" fill="#334155">本图为学习示意，不构成产品安全策略或正式 Automotive SPICE PAM 图示。</text>
</svg>