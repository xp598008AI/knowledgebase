  <rect width="1800" height="1200" fill="#F8FAFC"/>
  <text x="900" y="48" text-anchor="middle" class="t">Automotive SPICE 4.0 项目价值流总览</text>
  <text x="900" y="76" text-anchor="middle" class="s">从真实项目流转理解 32 个过程：输入 → 系统分解 → 多域开发 → 集成验证 → 确认 → 发布 → 反馈改进</text>

  <rect x="55" y="100" width="1690" height="100" rx="16" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
  <text x="80" y="130" class="h">① 项目输入与范围</text>
  <rect class="box" x="80" y="145" width="220" height="40" fill="#FFFFFF" stroke="#D97706"/><text x="190" y="170" text-anchor="middle" class="n">客户 / 法规 / 合同 / 场景</text>
  <rect class="box" x="325" y="145" width="170" height="40" fill="#FFEDD5" stroke="#D97706"/><text x="410" y="170" text-anchor="middle" class="n">SYS.1 需求获取</text>
  <rect class="box" x="520" y="145" width="170" height="40" fill="#F1F5F9" stroke="#64748B"/><text x="605" y="170" text-anchor="middle" class="n">MAN.3 项目管理</text>
  <rect class="box" x="715" y="145" width="170" height="40" fill="#F1F5F9" stroke="#64748B"/><text x="800" y="170" text-anchor="middle" class="n">MAN.5 风险管理</text>
  <rect class="box" x="910" y="145" width="170" height="40" fill="#F1F5F9" stroke="#64748B"/><text x="995" y="170" text-anchor="middle" class="n">MAN.6 度量</text>
  <rect class="box" x="1105" y="145" width="170" height="40" fill="#FFEDD5" stroke="#D97706"/><text x="1190" y="170" text-anchor="middle" class="n">ACQ.4 供应商监控</text>
  <rect class="box" x="1300" y="145" width="200" height="40" fill="#FEF3C7" stroke="#D97706"/><text x="1400" y="170" text-anchor="middle" class="n">G0 范围与计划门禁</text>
  <path d="M300 165 L325 165 M495 165 L520 165" class="a"/>

  <rect x="55" y="225" width="1690" height="660" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
