  <rect x="540" y="335" width="710" height="110" rx="12" fill="#F5F3FF" stroke="#A78BFA"/>
  <text x="555" y="360" class="n">SWE 软件工程</text>
  <rect class="box" x="560" y="375" width="95" height="44" fill="#EDE9FE" stroke="#7C3AED"/><text x="607" y="402" text-anchor="middle" class="n">SWE.1</text>
  <rect class="box" x="670" y="375" width="95" height="44" fill="#EDE9FE" stroke="#7C3AED"/><text x="717" y="402" text-anchor="middle" class="n">SWE.2</text>
  <rect class="box" x="780" y="375" width="95" height="44" fill="#EDE9FE" stroke="#7C3AED"/><text x="827" y="402" text-anchor="middle" class="n">SWE.3</text>
  <rect class="box" x="890" y="375" width="95" height="44" fill="#D1FAE5" stroke="#059669"/><text x="937" y="402" text-anchor="middle" class="n">SWE.4</text>
  <rect class="box" x="1000" y="375" width="95" height="44" fill="#D1FAE5" stroke="#059669"/><text x="1047" y="402" text-anchor="middle" class="n">SWE.5</text>
  <rect class="box" x="1110" y="375" width="95" height="44" fill="#D1FAE5" stroke="#059669"/><text x="1157" y="402" text-anchor="middle" class="n">SWE.6</text>
  <path d="M655 397 L670 397 M765 397 L780 397 M875 397 L890 397 M985 397 L1000 397 M1095 397 L1110 397" class="a"/>

  <rect x="540" y="465" width="710" height="110" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="555" y="490" class="n">HWE 硬件工程</text>
  <rect class="box" x="620" y="505" width="120" height="44" fill="#FFEDD5" stroke="#EA580C"/><text x="680" y="532" text-anchor="middle" class="n">HWE.1</text>
  <rect class="box" x="775" y="505" width="120" height="44" fill="#FFEDD5" stroke="#EA580C"/><text x="835" y="532" text-anchor="middle" class="n">HWE.2</text>
  <rect class="box" x="930" y="505" width="120" height="44" fill="#D1FAE5" stroke="#059669"/><text x="990" y="532" text-anchor="middle" class="n">HWE.3</text>
  <rect class="box" x="1085" y="505" width="120" height="44" fill="#D1FAE5" stroke="#059669"/><text x="1145" y="532" text-anchor="middle" class="n">HWE.4</text>
  <path d="M740 527 L775 527 M895 527 L930 527 M1050 527 L1085 527" class="a"/>

  <rect x="540" y="595" width="710" height="110" rx="12" fill="#FDF4FF" stroke="#D8B4FE"/>
  <text x="555" y="620" class="n">MLE 机器学习工程（适用时）</text>
  <rect class="box" x="620" y="635" width="120" height="44" fill="#F3E8FF" stroke="#9333EA"/><text x="680" y="662" text-anchor="middle" class="n">MLE.1</text>
  <rect class="box" x="775" y="635" width="120" height="44" fill="#F3E8FF" stroke="#9333EA"/><text x="835" y="662" text-anchor="middle" class="n">MLE.2</text>
  <rect class="box" x="930" y="635" width="120" height="44" fill="#F3E8FF" stroke="#9333EA"/><text x="990" y="662" text-anchor="middle" class="n">MLE.3</text>
  <rect class="box" x="1085" y="635" width="120" height="44" fill="#D1FAE5" stroke="#059669"/><text x="1145" y="662" text-anchor="middle" class="n">MLE.4</text>
  <path d="M740 657 L775 657 M895 657 L930 657 M1050 657 L1085 657" class="a"/>

  <rect class="box" x="715" y="725" width="355" height="42" fill="#FEF3C7" stroke="#D97706"/><text x="892" y="751" text-anchor="middle" class="n">G3 域内验证完成：需求、设计、接口、证据可追溯</text>

  <rect x="1305" y="285" width="400" height="500" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="1325" y="313" class="h">C. 系统汇合、确认与发布</text>
  <rect class="box" x="1340" y="350" width="150" height="52" fill="#D1FAE5" stroke="#059669"/><text x="1415" y="372" text-anchor="middle" class="n">SYS.4</text><text x="1415" y="391" text-anchor="middle" class="x">系统集成验证</text>
  <rect class="box" x="1520" y="350" width="150" height="52" fill="#D1FAE5" stroke="#059669"/><text x="1595" y="372" text-anchor="middle" class="n">SYS.5</text><text x="1595" y="391" text-anchor="middle" class="x">系统验证</text>
  <rect class="box" x="1430" y="430" width="150" height="52" fill="#D1FAE5" stroke="#059669"/><text x="1505" y="452" text-anchor="middle" class="n">VAL.1</text><text x="1505" y="471" text-anchor="middle" class="x">Validation</text>
  <rect class="box" x="1430" y="510" width="150" height="52" fill="#D1FAE5" stroke="#059669"/><text x="1505" y="532" text-anchor="middle" class="n">SPL.2</text><text x="1505" y="551" text-anchor="middle" class="x">产品发布</text>
  <rect class="box" x="1375" y="590" width="260" height="42" fill="#FEF3C7" stroke="#D97706"/><text x="1505" y="616" text-anchor="middle" class="n">G4 发布门禁：验证、确认、问题、基线齐套</text>
  <path d="M1490 376 L1520 376 M1595 402 L1595 430 L1580 430 M1505 482 L1505 510" class="a"/>

  <path d="M485 375 L515 375" class="a"/>
  <path d="M1275 535 L1305 535" class="a"/>

  <rect x="55" y="910" width="1690" height="155" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="80" y="940" class="h">③ 全生命周期控制总线</text>
  <rect class="box" x="85" y="965" width="160" height="42" fill="#F8FAFC" stroke="#64748B"/><text x="165" y="991" text-anchor="middle" class="n">SUP.1 质量保证</text>
  <rect class="box" x="265" y="965" width="180" height="42" fill="#F8FAFC" stroke="#64748B"/><text x="355" y="991" text-anchor="middle" class="n">SUP.8 配置管理</text>
  <rect class="box" x="465" y="965" width="190" height="42" fill="#FEE2E2" stroke="#B91C1C"/><text x="560" y="991" text-anchor="middle" class="n">SUP.9 问题解决</text>
  <rect class="box" x="675" y="965" width="210" height="42" fill="#FEE2E2" stroke="#B91C1C"/><text x="780" y="991" text-anchor="middle" class="n">SUP.10 变更请求管理</text>
  <rect class="box" x="905" y="965" width="205" height="42" fill="#F8FAFC" stroke="#64748B"/><text x="1007" y="991" text-anchor="middle" class="n">SUP.11 ML 数据管理</text>
  <rect class="box" x="1130" y="965" width="165" height="42" fill="#F8FAFC" stroke="#64748B"/><text x="1212" y="991" text-anchor="middle" class="n">PIM.3 过程改进</text>
  <rect class="box" x="1315" y="965" width="205" height="42" fill="#F8FAFC" stroke="#64748B"/><text x="1417" y="991" text-anchor="middle" class="n">REU.2 产品复用管理</text>
  <rect class="box" x="1540" y="965" width="160" height="42" fill="#F8FAFC" stroke="#64748B"/><text x="1620" y="991" text-anchor="middle" class="n">经验与组织资产</text>

  <path d="M560 1007 C560 1100 260 1100 260 1060" class="r"/>
  <path d="M780 1007 C780 1120 410 1120 410 1060" class="r"/>
  <path d="M1212 1007 C1212 1100 1500 1100 1500 1060" class="d"/>

  <rect x="55" y="1090" width="1690" height="70" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="80" y="1117" class="n">关键理解：</text>
  <text x="180" y="1117" class="s">SYS.1 是需求入口；SYS.3 将系统需求分配到 SWE / HWE / MLE；各域完成后回到 SYS.4 / SYS.5；VAL.1 关注预期用途；SPL.2 完成受控发布。</text>
  <text x="80" y="1143" class="s">管理、质量、配置、问题、变更、度量、改进不是“最后补材料”，而是贯穿项目的控制机制。箭头表示典型工程信息流，不代表 ASPICE 强制时序。</text>
</svg>