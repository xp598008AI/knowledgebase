  <rect x="85" y="285" width="400" height="180" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="105" y="313" class="h">A. 系统定义</text>
  <rect class="box" x="115" y="335" width="150" height="52" fill="#DBEAFE" stroke="#2563EB"/><text x="190" y="357" text-anchor="middle" class="n">SYS.2</text><text x="190" y="376" text-anchor="middle" class="x">系统需求分析</text>
  <rect class="box" x="300" y="335" width="150" height="52" fill="#DBEAFE" stroke="#2563EB"/><text x="375" y="357" text-anchor="middle" class="n">SYS.3</text><text x="375" y="376" text-anchor="middle" class="x">系统架构设计</text>
  <rect class="box" x="205" y="405" width="150" height="40" fill="#FEF3C7" stroke="#D97706"/><text x="280" y="430" text-anchor="middle" class="n">G1/G2 基线门禁</text>
  <path d="M265 361 L300 361" class="a"/>

  <rect x="515" y="285" width="760" height="500" rx="14" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="2"/>
