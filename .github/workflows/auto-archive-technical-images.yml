name: Auto-archive technical images

on:
  push:
    branches: [main]
    paths:
      - '06-创新、扩展与职业竞争/技术图片资产库/待归档/**'
      - '.github/workflows/auto-archive-technical-images.yml'
      - '知识库管理/scripts/auto_archive_technical_images.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-archive-technical-images
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile-check image upload bridge
        run: python -c "import ast,pathlib; files=list(map(pathlib.Path, ('知识库管理/scripts/push_technical_image.py', '知识库管理/scripts/auto_archive_technical_images.py', '知识库管理/scripts/check_image_refs.py', '知识库管理/scripts/check_markdown_links.py'))); [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in files]; print('Syntax OK:', len(files), 'Python scripts')"
      - name: Validate staged images
        run: python 知识库管理/scripts/auto_archive_technical_images.py
      - name: Archive images and update Markdown
        run: python 知识库管理/scripts/auto_archive_technical_images.py --apply
      - name: Validate archived images and Markdown links
        run: python 知识库管理/scripts/check_image_refs.py
      - name: Commit archive results
        run: |
          if git diff --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: automatically archive technical images"
          git push
